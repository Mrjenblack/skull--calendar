<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقویم جمجمه | Skull Calendar</title>
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skull Calendar">
<link rel="icon" id="favIcon" href="">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4af37; --gold-soft:#e8c766; --black:#0b0b0d; --black-2:#141416;
    --white:#f4f2ea; --gray:#57565f; --accent: var(--gold); --accent-dim: rgba(212,175,55,.18);
  }
  *{box-sizing:border-box;}
  body.theme-black{--accent:#d4af37;}
  body.theme-gold{--accent:#d4af37;}
  body.theme-purple{--accent:#9a5bd0;}
  body.theme-gray{--accent:#9a9aa3;}
  body.theme-green{--accent:#2f9e63;}
  body.theme-blue{--accent:#3d7bd9;}
  body.theme-red{--accent:#d9534f;}
  body.theme-white{--accent:#f4f2ea;}

  html,body{margin:0;padding:0;height:100%;background:var(--black);color:var(--white);
    font-family:'Inter','Vazirmatn',sans-serif; overflow-x:hidden;}
  body[data-script="fa"], body[data-script="ar"]{font-family:'Vazirmatn','Inter',sans-serif;}

  .bg-watermark{position:fixed; inset:0; z-index:0; opacity:.05; pointer-events:none;
    display:flex; align-items:center; justify-content:center;}
  .bg-watermark svg{width:70vmin;height:70vmin;}

  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; background:linear-gradient(180deg,#0b0b0d 0%, #101013 100%);
    box-shadow:0 0 60px rgba(0,0,0,.6);}

  header.top{padding:20px 20px 12px; text-align:center; border-bottom:1px solid rgba(212,175,55,.15);}
  .logo-row{display:flex; align-items:center; justify-content:center; gap:10px;}
  .logo-row svg{width:44px;height:44px;flex-shrink:0;}
  .app-name{font-family:'Cinzel','Vazirmatn',serif; font-weight:900; letter-spacing:1px;
    font-size:1.3rem; color:var(--accent); text-shadow:0 0 18px rgba(212,175,55,.25);}
  body[data-script="fa"] .app-name, body[data-script="ar"] .app-name{font-family:'Vazirmatn',sans-serif; font-weight:700;}
  .subtitle{font-size:.66rem; color:var(--gray); letter-spacing:2px; text-transform:uppercase; margin-top:2px;}

  .storage-banner{background:rgba(217,83,79,.12); color:#e88; border-bottom:1px solid rgba(217,83,79,.3);
    font-size:.72rem; text-align:center; padding:7px 14px; line-height:1.5;}

  .live-clock{text-align:center; padding:6px 0 2px; font-family:'Cinzel','Vazirmatn',serif;
    color:var(--accent); letter-spacing:1px; direction:ltr;}
  .live-clock #clockMain{font-size:1.5rem; font-weight:700;}
  .live-clock #clockCenti{font-size:.95rem; color:var(--gray); font-weight:600;}

  nav.cal-tabs{display:flex; gap:6px; padding:12px 16px 0;}
  .tab-btn{flex:1; padding:9px 4px; text-align:center; background:transparent; color:var(--gray);
    border:1px solid rgba(255,255,255,.08); border-radius:10px; font-size:.76rem; cursor:pointer;
    transition:.2s; font-weight:600;}
  .tab-btn.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}

  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 4px;}
  .nav-arrow{width:34px;height:34px;border-radius:50%; border:1px solid rgba(255,255,255,.1);
    background:var(--black-2); color:var(--white); font-size:1rem; cursor:pointer; display:flex;
    align-items:center; justify-content:center; transition:.2s;}
  .nav-arrow:hover{border-color:var(--accent); color:var(--accent);}
  .month-title{font-family:'Cinzel','Vazirmatn',serif; font-weight:700; font-size:1rem; color:var(--white); text-align:center;}
  .month-sub{font-size:.65rem; color:var(--gray); text-align:center; margin-top:2px;}
  body[data-script="fa"] .month-title, body[data-script="ar"] .month-title{font-family:'Vazirmatn',sans-serif;}

  .grid-wrap{padding:6px 16px 8px;}
  .weekday-row, .day-row{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .weekday-row div{text-align:center; font-size:.66rem; color:var(--gray); padding:5px 0; font-weight:600;}
  .day-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; font-size:.82rem; color:var(--white); cursor:pointer; position:relative;
    background:rgba(255,255,255,.02); border:1px solid transparent; transition:.15s;}
  .day-cell.empty{visibility:hidden;}
  .day-cell:hover{border-color:rgba(212,175,55,.4);}
  .day-cell.weekend-day{color:#5b9bf0; font-weight:700;}
  .day-cell.info-day{color:#b28fe0; font-weight:700;}
  .day-cell.holiday-day{color:#e6473f; font-weight:800;}
  .day-cell.today{border-color:var(--accent); color:var(--accent); font-weight:800;}
  .day-cell.selected{background:var(--accent); color:#0b0b0d; font-weight:800;}
  .dot-row{position:absolute; bottom:3px; display:flex; gap:2px;}
  .dot{width:4px;height:4px;border-radius:50%;}
  .dot.holiday{background:#d9534f;}
  .dot.info{background:#9a5bd0;}
  .dot.event{background:#3d7bd9;}
  .day-cell.selected .dot.holiday, .day-cell.selected .dot.event{background:#0b0b0d;}

  .detail-panel{margin:10px 16px 0; padding:14px; border-radius:14px; background:var(--black-2);
    border:1px solid rgba(212,175,55,.15); font-size:.8rem;}
  .detail-row{display:flex; justify-content:space-between; padding:5px 0; color:var(--white);}
  .detail-row span:first-child{color:var(--gray);}
  .holiday-tag{display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:20px;
    background:rgba(217,83,79,.15); color:#e88; font-size:.72rem; border:1px solid rgba(217,83,79,.3);}
  .info-tag{display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:20px;
    background:rgba(154,91,208,.15); color:#c6a3e8; font-size:.72rem; border:1px solid rgba(154,91,208,.3);}
  .event-tag{display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:20px;
    background:rgba(61,123,217,.15); color:#8ab4e8; font-size:.72rem; border:1px solid rgba(61,123,217,.3);}

  .month-holidays{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(212,175,55,.05);
    border:1px solid rgba(212,175,55,.12); font-size:.78rem;}
  .month-holidays .mh-title{color:var(--accent); font-weight:700; margin-bottom:6px;}
  .mh-item{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.06);}

  .week-row{display:flex; flex-direction:column; gap:6px;}
  .week-day-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px;
    background:rgba(255,255,255,.02); border:1px solid transparent; cursor:pointer;}
  .week-day-item.today{border-color:var(--accent);}
  .week-day-item.selected{background:var(--accent-dim); border-color:var(--accent);}
  .week-day-item .wd-num{font-family:'Cinzel','Vazirmatn',serif; font-size:1.1rem; font-weight:700; width:34px; text-align:center;}
  .week-day-item .wd-name{font-size:.72rem; color:var(--gray); width:36px;}
  .week-day-item .wd-tags{flex:1; font-size:.7rem; color:var(--gray); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .week-day-item.holiday-day .wd-num{color:#e6473f;}
  .week-day-item.weekend-day .wd-num{color:#5b9bf0;}

  .mini-month{background:rgba(255,255,255,.02); border-radius:12px; padding:8px; cursor:pointer; border:1px solid transparent;}
  .mini-month:hover{border-color:rgba(212,175,55,.3);}
  .mini-month .mm-title{text-align:center; font-size:.74rem; color:var(--accent); font-weight:700; margin-bottom:4px;}
  .mini-month .mm-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px;}
  .mini-month .mm-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:.52rem; color:var(--white); border-radius:2px;}
  .mini-month .mm-cell.mm-today{background:var(--accent); color:#0b0b0d; font-weight:700;}
  .mini-month .mm-cell.mm-holiday{color:#e6473f; font-weight:700;}
  .mini-month .mm-cell.mm-empty{visibility:hidden;}
  .mh-item:last-child{border-bottom:none;}
  .mh-item span:last-child{color:var(--gray); font-size:.72rem;}

  footer.bottom-bar{margin-top:auto; display:flex; border-top:1px solid rgba(212,175,55,.15); flex-wrap:wrap;}
  .bottom-btn{flex:1; min-width:60px; padding:12px 4px; text-align:center; color:var(--gray); background:none; border:none;
    font-size:.66rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bottom-btn:hover{color:var(--accent);}

  .sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none;
    align-items:flex-end; justify-content:center;}
  .sheet-overlay.open{display:flex;}
  .sheet{width:100%; max-width:480px; background:#131316; border-radius:20px 20px 0 0; padding:20px;
    max-height:85vh; overflow-y:auto; border-top:1px solid rgba(212,175,55,.25); position:relative;}
  .sheet h3{font-family:'Cinzel','Vazirmatn',serif; color:var(--accent); margin:0 0 14px; font-size:1rem;}
  body[data-script="fa"] .sheet h3, body[data-script="ar"] .sheet h3{font-family:'Vazirmatn',sans-serif;}
  .sheet-close{position:absolute; top:16px; inset-inline-end:18px; background:none; border:none; color:var(--gray);
    font-size:1.3rem; cursor:pointer;}
  .field-label{font-size:.7rem; color:var(--gray); margin:14px 0 6px; text-transform:uppercase; letter-spacing:1px;}
  select.field, input.field{width:100%; padding:10px; border-radius:10px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.88rem; font-family:inherit;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:36px; height:36px; border-radius:50%; cursor:pointer; border:2px solid transparent; position:relative;}
  .swatch.selected{border-color:var(--white); box-shadow:0 0 0 2px var(--accent);}
  .about-box{margin-top:16px; padding:14px; border-radius:12px; background:rgba(212,175,55,.06);
    border:1px solid rgba(212,175,55,.2); font-size:.82rem; line-height:1.8;}
  .about-box b{color:var(--accent);}
  .subtab-row{display:flex; gap:6px; margin-bottom:12px;}
  .subtab{flex:1; padding:8px; text-align:center; border-radius:8px; background:var(--black-2); color:var(--gray);
    font-size:.76rem; cursor:pointer; border:1px solid rgba(255,255,255,.08);}
  .subtab.active{color:var(--accent); border-color:var(--accent); background:var(--accent-dim);}
  .btn{width:100%; padding:11px; border-radius:10px; background:var(--accent); color:#0b0b0d; border:none;
    font-weight:700; font-size:.85rem; cursor:pointer; margin-top:8px;}
  .btn.secondary{background:var(--black-2); color:var(--white); border:1px solid rgba(255,255,255,.14);}
  .result-box{margin-top:14px; padding:14px; border-radius:12px; background:var(--black-2);
    border:1px solid rgba(212,175,55,.2); font-size:.85rem; line-height:1.9;}
  .result-box b{color:var(--accent); font-size:1.05rem;}
  .event-item{display:flex; justify-content:space-between; align-items:center; padding:10px;
    border-radius:10px; background:var(--black-2); margin-bottom:8px; border:1px solid rgba(255,255,255,.06);}
  .event-item .ei-txt{font-size:.82rem;}
  .event-item .ei-date{font-size:.7rem; color:var(--gray);}
  .del-btn{background:none; border:none; color:#d9534f; font-size:1.1rem; cursor:pointer; padding:4px 8px;}
  .todo-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
    background:var(--black-2); margin-bottom:6px; border:1px solid rgba(255,255,255,.06);}
  .todo-item input[type=checkbox]{width:18px;height:18px; flex-shrink:0; accent-color:var(--accent);}
  .todo-item .ti-text{flex:1; font-size:.82rem;}
  .todo-item.done .ti-text{text-decoration:line-through; color:var(--gray);}
  .dot.todo{background:#2f9e63;}
  .empty-note{color:var(--gray); font-size:.8rem; text-align:center; padding:14px 0;}
  .note-small{font-size:.7rem; color:var(--gray); margin-top:10px; line-height:1.6;}

  .icon-btn-row{display:flex; gap:8px; margin-top:8px;}
  .icon-btn{padding:6px 12px; border-radius:20px; background:var(--black-2); color:var(--accent);
    border:1px solid rgba(212,175,55,.25); font-size:.72rem; cursor:pointer; display:flex; align-items:center; gap:4px;}
  .tip-box{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.12); font-size:.78rem; line-height:1.7; color:var(--white);}
  .tip-box .tt{color:var(--accent); font-weight:700; margin-bottom:4px;}
  .tip-box .td{color:var(--gray); font-size:.66rem; margin-top:6px;}
  .hafez-verse{font-family:'Vazirmatn',serif; font-size:.86rem; line-height:2.1; color:var(--gold-soft); text-align:center; padding:4px 0;}

  .moon-visual{display:flex; align-items:center; gap:16px; margin-top:10px;}
  .moon-disc{width:70px;height:70px;border-radius:50%; background:#1a1a1d; position:relative; overflow:hidden; flex-shrink:0;
    box-shadow:inset 0 0 12px rgba(0,0,0,.6);}
  .moon-disc .lit{position:absolute; top:0; height:100%; background:#e8dfc0;}
  .moon-stats{font-size:.82rem; line-height:1.9;}
  .moon-stats b{color:var(--accent);}

  .color-dot-select{display:flex; gap:8px; margin-top:2px;}
  .cdot{width:26px;height:26px;border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .cdot.selected{border-color:var(--white);}

  .share-card{border-radius:16px; padding:20px; background:linear-gradient(160deg,#141416,#0b0b0d);
    border:1px solid rgba(212,175,55,.3); text-align:center;}
  .share-card .sc-name{font-family:'Cinzel','Vazirmatn',serif; color:var(--gold); font-size:.85rem; letter-spacing:1px; margin-bottom:10px;}
  .share-card .sc-line{color:var(--white); font-size:.9rem; padding:4px 0;}
  .share-card .sc-line b{color:var(--gold);}
  .share-card .sc-hol{color:#e88; font-size:.76rem; margin-top:8px;}
  textarea.field{width:100%; min-height:70px; border-radius:10px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.78rem; padding:10px; font-family:inherit;}

  body[data-mode="light"]{ --black:#f3f1ea; --black-2:#ffffff; --white:#1c1b18; --gray:#6b6a63; }
  body[data-mode="light"] .app{ background:linear-gradient(180deg,#f6f4ec 0%, #eeece2 100%); box-shadow:0 0 40px rgba(0,0,0,.12); }
  body[data-mode="light"] .day-cell{ background:rgba(0,0,0,.02); }
  body[data-mode="light"] .bg-watermark{ opacity:.04; }
  body[data-mode="light"] .sheet{ background:#fdfcf7; }
  body[data-mode="light"] .month-holidays, body[data-mode="light"] .detail-panel, body[data-mode="light"] .tip-box{
    background:rgba(0,0,0,.02); }

  .mode-toggle-row{display:flex; gap:8px; margin-top:6px;}
  .mode-btn{flex:1; padding:9px; text-align:center; border-radius:10px; background:var(--black-2); color:var(--gray);
    border:1px solid rgba(255,255,255,.1); font-size:.78rem; cursor:pointer;}
  .mode-btn.active{color:var(--accent); border-color:var(--accent); background:var(--accent-dim);}

  .countdown-panel{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(61,123,217,.06);
    border:1px solid rgba(61,123,217,.2); font-size:.78rem;}
  .countdown-panel .cp-title{color:#8ab4e8; font-weight:700; margin-bottom:6px;}
  .countdown-row{display:flex; justify-content:space-between; align-items:center; padding:4px 0;}
  .countdown-time{font-family:'Cinzel','Vazirmatn',serif; font-weight:700; color:var(--white); letter-spacing:1px;}

  .jump-row{display:flex; gap:6px; align-items:center;}
  .jump-row input{width:56px; padding:7px; border-radius:8px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.8rem; text-align:center;}
  .jump-go{padding:7px 12px; border-radius:8px; background:var(--accent); color:#0b0b0d; border:none; font-weight:700; font-size:.78rem; cursor:pointer;}

  .note-dot{background:#9a9aa3 !important;}

  .loc-row{display:flex; gap:8px; margin-top:4px;}
  .loc-btn{flex:1; padding:9px; text-align:center; border-radius:10px; background:var(--black-2); color:var(--accent);
    border:1px solid rgba(212,175,55,.25); font-size:.76rem; cursor:pointer;}
  .prayer-list{margin-top:14px;}
  .weather-box{margin-top:12px; padding:14px; border-radius:14px; background:rgba(61,123,217,.06);
    border:1px solid rgba(61,123,217,.2); display:flex; align-items:center; gap:14px;}
  .weather-box .w-icon{font-size:2.2rem;}
  .weather-box .w-temp{font-family:'Cinzel','Vazirmatn',serif; font-size:1.3rem; font-weight:700; color:var(--white);}
  .weather-box .w-desc{font-size:.76rem; color:var(--gray);}
  .prayer-item{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px;
    background:var(--black-2); margin-bottom:6px; border:1px solid rgba(255,255,255,.06); font-size:.85rem;}
  .prayer-item.current{border-color:var(--accent); background:var(--accent-dim);}
  .prayer-item .pi-name{color:var(--white);}
  .prayer-item .pi-time{color:var(--accent); font-weight:700; font-family:'Cinzel','Vazirmatn',serif;}
  .qibla-box{margin-top:16px; display:flex; align-items:center; gap:16px;}
  .compass-wrap{width:90px;height:90px;border-radius:50%; border:2px solid rgba(212,175,55,.3); position:relative; flex-shrink:0;
    background:radial-gradient(circle, rgba(212,175,55,.05), transparent 70%);}
  .compass-n{position:absolute; top:4px; left:50%; transform:translateX(-50%); font-size:.6rem; color:var(--gray);}
  .compass-arrow{position:absolute; top:50%; left:50%; width:3px; height:36px; background:var(--accent);
    margin-left:-1.5px; margin-top:-36px; transform-origin:50% 100%; border-radius:2px 2px 0 0;}
  .qibla-stats{font-size:.82rem; line-height:1.9;}
  .qibla-stats b{color:var(--accent);}
  .loc-manual{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;}

  .layer-row{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px;
    background:var(--black-2); margin-bottom:6px; border:1px solid rgba(255,255,255,.06); font-size:.82rem;}
  .layer-row .lr-name{display:flex; align-items:center; gap:8px;}
  .layer-swatch{width:10px;height:10px;border-radius:50%; flex-shrink:0;}
  .toggle-switch{width:40px; height:22px; border-radius:20px; background:rgba(255,255,255,.12); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle-switch.on{background:var(--accent);}
  .toggle-switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s;}
  .toggle-switch.on .knob{left:20px;}
  .layer-entry-item{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:8px;
    background:var(--black-2); margin-bottom:5px; font-size:.78rem; border:1px solid rgba(255,255,255,.05);}
  @media (max-width:360px){ .app-name{font-size:1.05rem;} .bottom-btn{font-size:.6rem;} }
</style>
</head>
<body class="theme-black" data-script="fa">

<div class="bg-watermark" id="watermark"></div>

<div class="app">
  <div class="storage-banner" id="storageBanner" style="display:none;"></div>
  <header class="top">
    <div class="logo-row">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 42 C20 30 14 14 6 4 M32 42 C24 26 20 10 16 2 M38 34 C34 20 32 8 30 0 M32 42 C16 40 6 34 2 26" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M88 42 C100 30 106 14 114 4 M88 42 C96 26 100 10 104 2 M82 34 C86 20 88 8 90 0 M88 42 C104 40 114 34 118 26" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M60 34 C40 34 30 50 32 66 C33 78 40 88 44 96 L48 108 L54 100 L60 110 L66 100 L72 108 L76 96 C80 88 87 78 88 66 C90 50 80 34 60 34 Z"

<script>
/* ================= date conversion engine ================= */
function div_(a,b){return Math.trunc(a/b);}
function mod_(a,b){return a-Math.trunc(a/b)*b;}

function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm, jump=0, leap, n, i, leapG, march;
  for(i=1;i<bl;i++){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ=leapJ+div_(jump,33)*8+div_(mod_(jump,33),4); jp=jm; }
  n=jy-jp;
  leapJ=leapJ+div_(n,33)*8+div_(mod_(n,33)+3,4);
  if(mod_(jump,33)===4 && jump-n===4) leapJ+=1;
  leapG=div_(gy,4)-div_((div_(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div_(jump+4,33)*33;
  leap=mod_(mod_(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function g2d(gy,gm,gd){
  var d=div_((gy+div_(gm-8,6)+100100)*1461,4)+div_(153*mod_(gm+9,12)+2,5)+gd-34840408;
  d=d-div_(div_(gy+100100+div_(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div_(div_(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div_(mod_(j,1461),4)*5+308;
  var gd=div_(mod_(i,153),5)+1;
  var gm=mod_(div_(i,153),12)+1;
  var gy=div_(j,1461)-100100+div_(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div_(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), jdn1f=g2d(gy,3,r.march), jd, jm, k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){ jm=1+div_(k,31); jd=mod_(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else k-=186;
  } else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+div_(k,30); jd=mod_(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function g2j(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function j2g(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }

function gregorianToJDN(y,m,d){
  var a=Math.trunc((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  return d+Math.trunc((153*m2+2)/5)+365*y2+Math.trunc(y2/4)-Math.trunc(y2/100)+Math.trunc(y2/400)-32045;
}
function jdnToGregorian(jdn){
  var a=jdn+32044, b=Math.trunc((4*a+3)/146097), c=a-Math.trunc((146097*b)/4);
  var d=Math.trunc((4*c+3)/1461), e=c-Math.trunc((1461*d)/4), m=Math.trunc((5*e+2)/153);
  var day=e-Math.trunc((153*m+2)/5)+1, month=m+3-12*Math.trunc(m/10), year=100*b+d-4800+Math.trunc(m/10);
  return {gy:year,gm:month,gd:day};
}
const HIJRI_EPOCH = 1948440; /* standard tabular (civil) Islamic calendar epoch — an unbiased calculated approximation; real moon-sighting announcements can differ by about ±1 day per month, and no single fixed offset corrects this for every month at once, so none is applied */
function hijriToJDN(y,m,d){
  return d + Math.ceil(29.5*(m-1)) + (y-1)*354 + Math.trunc((3+11*y)/30) + HIJRI_EPOCH - 1;
}
function jdnToHijri(jdn){
  var year = Math.trunc((30*(jdn-HIJRI_EPOCH)+10646)/10631);
  var month = Math.min(12, Math.ceil((jdn - (29 + hijriToJDN(year,1,1)))/29.5) + 1);
  var day = (jdn - hijriToJDN(year,month,1)) + 1;
  return {hy:year, hm:month, hd:day};
}
function g2h(gy,gm,gd){ return jdnToHijri(gregorianToJDN(gy,gm,gd)); }
function h2g(hy,hm,hd){ return jdnToGregorian(hijriToJDN(hy,hm,hd)); }

function daysInJalaliMonth(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  return jalCal(jy).leap===0? 30:29;
}
function daysInGregorianMonth(gy,gm){ return new Date(gy,gm,0).getDate(); }
function daysInHijriMonth(hy,hm){
  const start=hijriToJDN(hy,hm,1);
  const nextY = hm===12? hy+1: hy;
  const nextM = hm===12? 1: hm+1;
  const end=hijriToJDN(nextY,nextM,1);
  return end-start;
}
function weekdayOfGregorian(gy,gm,gd){ return new Date(gy,gm-1,gd).getDay(); }

/* ================= prayer times (NOAA solar position + Univ. of Tehran angles) ================= */
function deg2rad(d){return d*Math.PI/180;}
function rad2deg(r){return r*180/Math.PI;}
function sinD(d){return Math.sin(deg2rad(d));}
function cosD(d){return Math.cos(deg2rad(d));}
function tanD(d){return Math.tan(deg2rad(d));}
function acosD(x){return rad2deg(Math.acos(Math.max(-1,Math.min(1,x))));}
function atanD(x){return rad2deg(Math.atan(x));}
function dayOfYear(y,m,d){
  const start=Date.UTC(y,0,1), cur=Date.UTC(y,m-1,d);
  return Math.round((cur-start)/86400000)+1;
}
function sunCalc(y,m,d){
  const N=dayOfYear(y,m,d);
  const gamma = 2*Math.PI/365*(N-1);
  const decl = 0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
    - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
    - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma);
  const eqtime = 229.18*(0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
    - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma));
  return {decl: rad2deg(decl), eqtime};
}
function hourAngle(lat, decl, zenith){
  const cosH = (cosD(zenith) - sinD(lat)*sinD(decl)) / (cosD(lat)*cosD(decl));
  if(cosH>1 || cosH<-1) return null;
  return acosD(cosH);
}
function minToHHMM(min){
  if(min===null) return "--:--";
  min = ((min%1440)+1440)%1440;
  const hh=Math.floor(min/60), mm=Math.round(min%60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function computePrayerTimes(y,m,d,lat,lon,tz){
  const {decl, eqtime} = sunCalc(y,m,d);
  const solarNoonMin = 720 - 4*lon - eqtime + 60*tz;
  const ha_sun = hourAngle(lat,decl,90.833);
  const ha_fajr = hourAngle(lat,decl,90+17.7);
  const ha_isha = hourAngle(lat,decl,90+14);
  const ha_maghrib = hourAngle(lat,decl,90+4.5);
  const asrAlt = atanD(1/(1+Math.abs(tanD(lat-decl))));
  const ha_asr = hourAngle(lat,decl,90-asrAlt);

  const dhuhr = solarNoonMin;
  const sunrise = ha_sun!==null? solarNoonMin - 4*ha_sun : null;
  const sunset = ha_sun!==null? solarNoonMin + 4*ha_sun : null;
  const fajr = ha_fajr!==null? solarNoonMin - 4*ha_fajr : null;
  const isha = ha_isha!==null? solarNoonMin + 4*ha_isha : null;
  const maghrib = ha_maghrib!==null? solarNoonMin + 4*ha_maghrib : null;
  const asr = ha_asr!==null? solarNoonMin + 4*ha_asr : null;
  const midnightMin = (sunset!==null && fajr!==null) ? sunset + (1440-(sunset-fajr))/2 : null;

  return {
    fajrMin:fajr, sunriseMin:sunrise, dhuhrMin:dhuhr, asrMin:asr, sunsetMin:sunset, maghribMin:maghrib, ishaMin:isha, midnightMin:midnightMin,
    fajr: minToHHMM(fajr), sunrise: minToHHMM(sunrise), dhuhr: minToHHMM(dhuhr), asr: minToHHMM(asr),
    sunset: minToHHMM(sunset), maghrib: minToHHMM(maghrib), isha: minToHHMM(isha), midnight: minToHHMM(midnightMin)
  };
}
function qiblaBearing(lat,lon){
  const dLon = KAABA.lon - lon;
  const bearing = rad2deg(Math.atan2(Math.sin(deg2rad(dLon)), Math.cos(deg2rad(lat))*Math.tan(deg2rad(KAABA.lat)) - Math.sin(deg2rad(lat))*Math.cos(deg2rad(dLon))));
  return (bearing+360)%360;
}
function qiblaDistanceKm(lat,lon){
  const R=6371;
  const dLat=deg2rad(KAABA.lat-lat), dLon=deg2rad(KAABA.lon-lon);
  const a=Math.sin(dLat/2)**2 + Math.cos(deg2rad(lat))*Math.cos(deg2rad(KAABA.lat))*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* ---- live weather (Open-Meteo: free, no API key, works once actually hosted) ---- */
const WMO_MAP = {
  0:{icon:'☀️',key:'w_clear'}, 1:{icon:'🌤️',key:'w_cloudy'}, 2:{icon:'⛅',key:'w_cloudy'}, 3:{icon:'☁️',key:'w_overcast'},
  45:{icon:'🌫️',key:'w_fog'}, 48:{icon:'🌫️',key:'w_fog'},
  51:{icon:'🌦️',key:'w_drizzle'}, 53:{icon:'🌦️',key:'w_drizzle'}, 55:{icon:'🌦️',key:'w_drizzle'},
  61:{icon:'🌧️',key:'w_rain'}, 63:{icon:'🌧️',key:'w_rain'}, 65:{icon:'🌧️',key:'w_rain'},
  71:{icon:'❄️',key:'w_snow'}, 73:{icon:'❄️',key:'w_snow'}, 75:{icon:'❄️',key:'w_snow'},
  80:{icon:'🌧️',key:'w_showers'}, 81:{icon:'🌧️',key:'w_showers'}, 82:{icon:'🌧️',key:'w_showers'},
  95:{icon:'⛈️',key:'w_thunder'}
};
let weatherCache = {lat:null, lon:null, ts:0, data:null};
async function fetchWeather(){
  const box = document.getElementById("weatherBox");
  if(!box) return;
  const lat=state.location.lat, lon=state.location.lon;
  const cacheOk = weatherCache.lat===lat && weatherCache.lon===lon && (Date.now()-weatherCache.ts) < 10*60*1000;
  if(cacheOk){ renderWeatherBox(weatherCache.data); return; }
  box.innerHTML = `<div class="w-desc">`+t2('weatherLoading')+`</div>`;
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code&timezone=auto";
    const resp = await fetch(url);
    const data = await resp.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    weatherCache = {lat, lon, ts:Date.now(), data:{temp, code}};
    renderWeatherBox(weatherCache.data);
  }catch(e){
    box.innerHTML = `<div class="w-desc">`+t2('weatherError')+`</div>`;
  }
}
function renderWeatherBox(data){
  const box = document.getElementById("weatherBox");
  if(!box || !data) return;
  const w = WMO_MAP[data.code] || {icon:'🌡️', key:'w_clear'};
  box.innerHTML = `<div class="w-icon">`+w.icon+`</div><div><div class="w-temp">`+data.temp+`°C</div><div class="w-desc">`+t2(w.key)+`</div></div>`;
}

const WEEKEND_PRESETS = {
  fri:[5], sat:[6], thu_fri:[4,5], fri_sat:[5,6], sat_sun:[6,0], sun:[0]
};
function isWeekend(gy,gm,gd){
  const wd=weekdayOfGregorian(gy,gm,gd);
  return (WEEKEND_PRESETS[state.weekendPreset]||[5]).includes(wd);
}

function todayParts(){
  const t=new Date();
  const gy=t.getFullYear(), gm=t.getMonth()+1, gd=t.getDate();
  const j=g2j(gy,gm,gd); const h=g2h(gy,gm,gd);
  return {gy,gm,gd, jy:j.jy,jm:j.jm,jd:j.jd, hy:h.hy,hm:h.hm,hd:h.hd};
}
const TODAY=todayParts();
state.viewJY=TODAY.jy; state.viewJM=TODAY.jm;
state.viewGY=TODAY.gy; state.viewGM=TODAY.gm;
state.viewHY=TODAY.hy; state.viewHM=TODAY.hm;

function T(){ return LANGS[state.lang]; }
function t2(key){ return LANGS[state.lang][key] !== undefined ? LANGS[state.lang][key] : LANGS.en[key]; }
function holidayName(hd){ return hd.name[state.lang] || hd.name.en || hd.name.fa; }
const EVENT_COLORS = [
  {key:'gold', color:'#d4af37'}, {key:'blue', color:'#3d7bd9'}, {key:'green', color:'#2f9e63'}, {key:'red', color:'#d9534f'}
];

function dateKey(gy,gm,gd){ return gy+"-"+gm+"-"+gd; }
function cellHolidays(gy,gm,gd){
  const j=g2j(gy,gm,gd), h=g2h(gy,gm,gd);
  let list=[];
  if(state.layers.world){
    INTL_DAYS.forEach(hd=>{ if(hd.m===gm && hd.d===gd) list.push({...hd, type:'info'}); });
  }
  if(state.layers.official){
    const country = CH[state.country]||[];
    country.forEach(hd=>{
      if(hd.sys==='g' && hd.m===gm && hd.d===gd) list.push({...hd, type:'official'});
      if(hd.sys==='j' && hd.m===j.jm && hd.d===j.jd) list.push({...hd, type:'official'});
      if(hd.sys==='h' && hd.m===h.hm && hd.d===h.hd) list.push({...hd, type:'official'});
    });
  }
  ['environment','health','astronomy','revolution'].forEach(layerKey=>{
    if(!state.layers[layerKey]) return;
    (LAYER_DATA[layerKey]||[]).forEach(hd=>{
      if(hd.sys==='g' && hd.m===gm && hd.d===gd) list.push({...hd, type:'info'});
      if(hd.sys==='j' && hd.m===j.jm && hd.d===j.jd) list.push({...hd, type:'info'});
      if(hd.sys==='h' && hd.m===h.hm && hd.d===h.hd) list.push({...hd, type:'info'});
    });
  });
  if(state.layers.worldcup2022){
    (LAYER_DATA.worldcup2022||[]).forEach(hd=>{
      if(hd.sys==='once' && hd.gy===gy && hd.m===gm && hd.d===gd) list.push({...hd, type:'info'});
    });
  }
  (state.customLayers||[]).forEach(cl=>{
    if(!cl.active) return;
    (cl.entries||[]).forEach(en=>{
      if(en.gy===gy && en.gm===gm && en.gd===gd) list.push({name:{fa:en.title,en:en.title}, type:'info', custom:true});
    });
  });
  return list;
}
function cellEvents(gy,gm,gd){
  const cellJDN = gregorianToJDN(gy,gm,gd);
  return state.events.filter(ev=>{
    const evJDN = gregorianToJDN(ev.gy,ev.gm,ev.gd);
    if(ev.repeat==='none'){
      if(ev.endGy){
        const endJDN = gregorianToJDN(ev.endGy,ev.endGm,ev.endGd);
        return cellJDN>=evJDN && cellJDN<=endJDN;
      }
      return ev.gy===gy && ev.gm===gm && ev.gd===gd;
    }
    if(cellJDN < evJDN) return false;
    if(ev.repeat==='yearly') return ev.gm===gm && ev.gd===gd;
    if(ev.repeat==='monthly') return ev.gd===gd;
    if(ev.repeat==='weekly') return (cellJDN-evJDN)%7===0;
    return false;
  });
}

    const officialHols=hols.filter(h=>h.type==='official');
    const infoHols=hols.filter(h=>h.type==='info');

    if(wknd){ cell.classList.add("weekend-day"); weekendDayCount++; }
    if(officialHols.length){ cell.classList.add("holiday-day"); holidayDaySet.add(meta.label); }
    else if(infoHols.length){ cell.classList.add("info-day"); }
    const hasNote = !!state.notes[dateKey(gy,gm,gd)];
    const hasPendingTodo = (state.todos[dateKey(gy,gm,gd)]||[]).some(td=>!td.done);

      cell.appendChild(dotRow);

function renderWeekView(){
  const t=T();
  const ws = state.weekStart[state.calType];
  const anchor = state.weekAnchor || {gy:TODAY.gy,gm:TODAY.gm,gd:TODAY.gd};
  const anchorJDN = gregorianToJDN(anchor.gy,anchor.gm,anchor.gd);
  const anchorWd = weekdayOfGregorian(anchor.gy,anchor.gm,anchor.gd);
  const offsetToWeekStart = (anchorWd - ws + 7)%7;
  const startJDN = anchorJDN - offsetToWeekStart;

  let days=[];
  for(let i=0;i<7;i++) days.push(jdnToGregorian(startJDN+i));

  function fmt(g){
    if(state.calType==='jalali'){ const j=g2j(g.gy,g.gm,g.gd); return j.jd+" "+t.monthsJ[j.jm-1]; }
    if(state.calType==='hijri'){ const h=g2h(g.gy,g.gm,g.gd); return h.hd+" "+t.monthsH[h.hm-1]; }
    return g.gd+" "+t.monthsG[g.gm-1];
  }
  document.getElementById("weekTitle").textContent = fmt(days[0])+" – "+fmt(days[6]);

  const container = document.getElementById("weekView");
  container.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className="week-row";
  days.forEach(g=>{
    const item = document.createElement("div"); item.className="week-day-item";
    if(g.gy===TODAY.gy && g.gm===TODAY.gm && g.gd===TODAY.gd) item.classList.add("today");
    if(state.selected && state.selected.gy===g.gy && state.selected.gm===g.gm && state.selected.gd===g.gd) item.classList.add("selected");
    if(isWeekend(g.gy,g.gm,g.gd)) item.classList.add("weekend-day");
    const hols=cellHolidays(g.gy,g.gm,g.gd);
    const officialHols=hols.filter(h=>h.type==='official');
    const infoHols=hols.filter(h=>h.type==='info');
    if(officialHols.length) item.classList.add("holiday-day");
    const evs=cellEvents(g.gy,g.gm,g.gd);
    const wd=weekdayOfGregorian(g.gy,g.gm,g.gd);

    let dayNum;
    if(state.calType==='jalali'){ dayNum=g2j(g.gy,g.gm,g.gd).jd; }
    else if(state.calType==='hijri'){ dayNum=g2h(g.gy,g.gm,g.gd).hd; }
    else dayNum=g.gd;

    const numEl=document.createElement("div"); numEl.className="wd-num"; numEl.textContent=dayNum;
    const nameEl=document.createElement("div"); nameEl.className="wd-name"; nameEl.textContent=t.weekdays[wd];
    const tagsEl=document.createElement("div"); tagsEl.className="wd-tags";
    let tagParts=[];
    officialHols.forEach(h=>tagParts.push(holidayName(h)));
    infoHols.forEach(h=>tagParts.push(holidayName(h)));
    evs.forEach(e=>tagParts.push(e.title));
    tagsEl.textContent = tagParts.join(" · ");

    item.appendChild(numEl); item.appendChild(nameEl); item.appendChild(tagsEl);
    item.addEventListener("click", ()=>{ state.selected={gy:g.gy,gm:g.gm,gd:g.gd}; render(); });
    wrap.appendChild(item);
  });
  container.appendChild(wrap);
}

function renderYearView(){
  const t=T();
  let year, monthsArr, daysInMonthFn, toGregorianFn;
  if(state.calType==='jalali'){
    year=state.viewJY; monthsArr=t.monthsJ;
    daysInMonthFn=(m)=>daysInJalaliMonth(year,m); toGregorianFn=(m,d)=>j2g(year,m,d);
  } else if(state.calType==='hijri'){
    year=state.viewHY; monthsArr=t.monthsH;
    daysInMonthFn=(m)=>daysInHijriMonth(year,m); toGregorianFn=(m,d)=>jdnToGregorian(hijriToJDN(year,m,d));
  } else {
    year=state.viewGY; monthsArr=t.monthsG;
    daysInMonthFn=(m)=>daysInGregorianMonth(year,m); toGregorianFn=(m,d)=>({gy:year,gm:m,gd:d});
  }
  document.getElementById("yearTitle").textContent = year;
  const grid = document.getElementById("yearGrid");
  grid.innerHTML = "";
  const ws = state.weekStart[state.calType];
  for(let m=1;m<=12;m++){
    const mm = document.createElement("div"); mm.className="mini-month";
    const title = document.createElement("div"); title.className="mm-title"; title.textContent=monthsArr[m-1];
    mm.appendChild(title);
    const g1 = toGregorianFn(m,1);
    const firstWd = weekdayOfGregorian(g1.gy,g1.gm,g1.gd);
    const offset = (firstWd - ws + 7)%7;
    const numDays = daysInMonthFn(m);
    const mg = document.createElement("div"); mg.className="mm-grid";
    for(let i=0;i<offset;i++){ const c=document.createElement("div"); c.className="mm-cell mm-empty"; mg.appendChild(c); }
    for(let d=1; d<=numDays; d++){
      const g = toGregorianFn(m,d);
      const c = document.createElement("div"); c.className="mm-cell"; c.textContent=d;
      if(g.gy===TODAY.gy && g.gm===TODAY.gm && g.gd===TODAY.gd) c.classList.add("mm-today");
      const hols=cellHolidays(g.gy,g.gm,g.gd).filter(h=>h.type==='official');
      if(hols.length) c.classList.add("mm-holiday");
      mg.appendChild(c);
    }
    mm.appendChild(mg);
    mm.addEventListener("click", ()=>{
      if(state.calType==='jalali') state.viewJM=m;
      else if(state.calType==='hijri') state.viewHM=m;
      else state.viewGM=m;
      state.viewMode='month';
      render();
    });
    grid.appendChild(mm);
  }
}

/* ---- safe storage wrapper: try window.storage (Claude artifacts), fall back to
   localStorage (works on any normal hosted site), fall back to in-memory only ---- */
let storageMode = "unknown"; // 'claude' | 'local' | 'memory'
function tryLocalStorage(){
  try{
    const testKey="__skull_test__";
    localStorage.setItem(testKey,"1");
    localStorage.removeItem(testKey);
    return true;
  }catch(e){ return false; }
}
async function safeStorageGet(key){
  if(storageMode==="memory") return null;
  if(storageMode==="unknown" || storageMode==="claude"){
    if(typeof window!=='undefined' && typeof window.storage!=='undefined'){
      try{
        const res = await window.storage.get(key, false);
        storageMode="claude";
        return res;
      }catch(e){ /* fall through to localStorage */ }
    }
  }
  if(storageMode==="unknown" || storageMode==="local"){
    if(tryLocalStorage()){
      storageMode="local";
      const raw = localStorage.getItem("skull_"+key);
      return raw ? {value:raw} : null;
    }
  }
  if(storageMode==="unknown"){ storageMode="memory"; showStorageBanner(); }
  return null;
}
async function safeStorageSet(key, value){
  if(storageMode==="memory") return;
  if(storageMode==="claude" || storageMode==="unknown"){
    if(typeof window!=='undefined' && typeof window.storage!=='undefined'){
      try{ await window.storage.set(key, value, false); storageMode="claude"; return; }
      catch(e){ /* fall through */ }
    }
  }
  if(storageMode==="local" || storageMode==="unknown"){
    if(tryLocalStorage()){
      try{ localStorage.setItem("skull_"+key, value); storageMode="local"; return; }
      catch(e){ /* fall through */ }
    }
  }
  storageMode="memory";
  showStorageBanner();
}
function showStorageBanner(){
  const b=document.getElementById("storageBanner");
  if(!b) return;
  b.textContent = t2("storageWarning");
  b.style.display="block";
}

async function loadEvents(){
  const res = await safeStorageGet('skull_events');
  try{ state.events = res? JSON.parse(res.value) : []; }catch(e){ state.events=[]; }

  const res2 = await safeStorageGet('skull_notes');
  try{ state.notes = res2? JSON.parse(res2.value) : {}; }catch(e){ state.notes={}; }

  const res2b = await safeStorageGet('skull_todos');
  try{ state.todos = res2b? JSON.parse(res2b.value) : {}; }catch(e){ state.todos={}; }

  const res3 = await safeStorageGet('skull_prefs');
  try{
    if(res3){
      const p=JSON.parse(res3.value);
      if(p.mode) state.mode=p.mode;
      if(p.fontSize) state.fontSize=p.fontSize;
      if(p.location) state.location=p.location;
      if(p.weekendPreset) state.weekendPreset=p.weekendPreset;
    }
  }catch(e){}

  const res4 = await safeStorageGet('skull_layers');
  try{
    if(res4){
      const l=JSON.parse(res4.value);
      if(l.layers) state.layers=Object.assign(state.layers, l.layers);
      if(l.customLayers) state.customLayers=l.customLayers;
    }
  }catch(e){}

  document.body.dataset.mode = state.mode;
  if(state.mode==='light'){
    document.getElementById("modeLightBtn").classList.add("active");
    document.getElementById("modeDarkBtn").classList.remove("active");
  }
  const map={small:"87%",medium:"100%",large:"113%",xlarge:"128%"};
  document.documentElement.style.fontSize = map[state.fontSize]||"100%";
  render();
  startCountdownTicker();
  startAlarmScanner();
}

function genericAge(by,bm,bd, ty,tm,td, daysInMonthFn){
  let years=ty-by, months=tm-bm, days=td-bd;
  if(days<0){
    let pm=tm-1, py=ty;
    if(pm<1){ pm=12; py=ty-1; }
    days += daysInMonthFn(py,pm);
    months--;
  }
  if(months<0){ months+=12; years--; }
  return {years,months,days};
}

function findNextEventOccurrence(ev, fromJDN){
  const evJDN = gregorianToJDN(ev.gy,ev.gm,ev.gd);
  if(ev.repeat==='none') return evJDN>=fromJDN? evJDN : null;
  if(evJDN>=fromJDN) return evJDN;
  if(ev.repeat==='weekly'){
    const diff=(fromJDN-evJDN)%7;
    return fromJDN + (diff===0?0:7-diff);
  }
  if(ev.repeat==='monthly'){
    let g=jdnToGregorian(fromJDN);
    let cand=gregorianToJDN(g.gy,g.gm,ev.gd<=daysInGregorianMonth(g.gy,g.gm)?ev.gd:daysInGregorianMonth(g.gy,g.gm));
    if(cand<fromJDN){ let ny=g.gm===12?g.gy+1:g.gy, nm=g.gm===12?1:g.gm+1; cand=gregorianToJDN(ny,nm,Math.min(ev.gd,daysInGregorianMonth(ny,nm))); }
    return cand;
  }
  if(ev.repeat==='yearly'){
    let g=jdnToGregorian(fromJDN);
    let cand=gregorianToJDN(g.gy,ev.gm,ev.gd);
    if(cand<fromJDN) cand=gregorianToJDN(g.gy+1,ev.gm,ev.gd);
    return cand;
  }
  return null;
}
function renderTip(){
  const t=T();
  const sel = state.selected || {gy:TODAY.gy,gm:TODAY.gm,gd:TODAY.gd};
  const hols=cellHolidays(sel.gy,sel.gm,sel.gd).filter(h=>h.type==='official');
  const evs=cellEvents(sel.gy,sel.gm,sel.gd);
  const todos=(state.todos[dateKey(sel.gy,sel.gm,sel.gd)]||[]).filter(td=>!td.done);
  const wd=weekdayOfGregorian(sel.gy,sel.gm,sel.gd);
  const todayJDN=gregorianToJDN(TODAY.gy,TODAY.gm,TODAY.gd);
  const isViewingToday = sel.gy===TODAY.gy && sel.gm===TODAY.gm && sel.gd===TODAY.gd;
  let lines=[];

  if(hols.length) lines.push(t2('tip_holiday').replace('{name}', hols.map(holidayName).join('، ')));
  if(evs.length) evs.forEach(ev=>{
    if(ev.isBirthday && ev.birthGY){
      lines.push(t2('tip_birthday').replace('{name}', ev.title).replace('{n}', sel.gy-ev.birthGY));
    } else {
      lines.push(t2('tip_hasEvent').replace('{name}', ev.title));
    }
  });
  if(todos.length) lines.push(t2('tip_hasTodos').replace('{n}', todos.length));

  // weather-aware line (only for today, only if we already have cached data — never triggers a new fetch here)
  if(isViewingToday && weatherCache.data && weatherCache.lat===state.location.lat && weatherCache.lon===state.location.lon){
    const code=weatherCache.data.code, temp=weatherCache.data.temp;
    if([61,63,65,80,81,82,51,53,55].includes(code)) lines.push(t2('tip_rain'));
    else if([71,73,75].includes(code)) lines.push(t2('tip_snow'));
    else if(temp>=32) lines.push(t2('tip_hot'));
    else if(temp<=2) lines.push(t2('tip_cold'));
  }

  // if nothing pressing so far, fall back to countdown / weekend / moon / rotating thought
  if(!lines.length){
    let nearestEv=null;
    state.events.forEach(ev=>{
      const occ=findNextEventOccurrence(ev, todayJDN+1);
      if(occ && (!nearestEv || occ<nearestEv.occ)) nearestEv={occ, ev};
    });
    let nearestHol=null;
    for(let i=1;i<200;i++){
      const g=jdnToGregorian(todayJDN+i);
      const hs=cellHolidays(g.gy,g.gm,g.gd).filter(h=>h.type==='official');
      if(hs.length){ nearestHol={n:i, name:holidayName(hs[0])}; break; }
    }
    if(nearestEv && nearestEv.occ-todayJDN<=5){
      lines.push(t2('tip_countdownEvent').replace('{n}', nearestEv.occ-todayJDN).replace('{name}', nearestEv.ev.title));
    } else if(nearestHol && nearestHol.n<=5){
      lines.push(t2('tip_countdownHoliday').replace('{n}', nearestHol.n).replace('{name}', nearestHol.name));
    } else if(wd===4 || wd===5){
      lines.push(t2('tip_weekend'));
    } else {
      const mp=moonPhase(sel.gy,sel.gm,sel.gd);
      if(mp.phaseKey==='phaseFull') lines.push(t2('tip_moonFull'));
      else if(mp.phaseKey==='phaseNew') lines.push(t2('tip_moonNew'));
      else lines.push(t2('tip_rotate')[wd]);
    }
  } else if(lines.length===1 && evs.length===0 && hols.length===0){
    // only a todo/weather line so far — add a small rotating thought too for a fuller brief
    lines.push(t2('tip_rotate')[wd]);
  }

  document.getElementById("tipBox").innerHTML =
    `<div class="tt">`+t2('tipTitle')+`</div>`+
    lines.map(l=>`<div>`+l+`</div>`).join("")+
    `<div class="td">`+t2('tipDisclaimer')+`</div>`;
  renderHafez();
}

/* ---- Hafez verse of the day (classical public-domain Persian poetry; a fun cultural extra, not real divination) ---- */
const HAFEZ_VERSES = [
  "الا یا ایها الساقی ادر کأساً و ناولها / که عشق آسان نمود اول ولی افتاد مشکل‌ها",
  "دوش وقت سحر از غصه نجاتم دادند / واندر آن ظلمت شب آب حیاتم دادند",
  "یوسف گم‌گشته باز آید به کنعان غم مخور / کلبه احزان شود روزی گلستان غم مخور",
  "اگر آن ترک شیرازی به دست آرد دل ما را / به خال هندویش بخشم سمرقند و بخارا را",
  "صبا به لطف بگو آن غزال رعنا را / که سر به کوه و بیابان تو داده‌ای ما را",
  "بیا تا گل برافشانیم و می در ساغر اندازیم / فلک را سقف بشکافیم و طرحی نو دراندازیم",
  "دل می‌رود ز دستم صاحب‌دلان خدا را / دردا که راز پنهان خواهد شد آشکارا",
  "سال‌ها دل طلب جام جم از ما می‌کرد / آنچه خود داشت ز بیگانه تمنا می‌کرد",
  "مرحبا طایر فرخ‌پی فرخنده‌پیام / خیر مقدم چه خبر دوست کجا راه کدام",
  "گل در بر و می در کف و معشوق به کام است / سلطان جهانم به چنین روز غلام است",
  "ای پادشه خوبان داد از غم تنهایی / دل بی تو به جان آمد وقت است که بازآیی",
  "دارم امید عاطفتی از جناب دوست / کردم جنایتی و امیدم به عفو اوست",
  "زلف آشفته و خوی‌کرده و خندان‌لب و مست / پیرهن‌چاک و غزل‌خوان و صراحی در دست",
  "بوی خوش تو هر که ز باد صبا شنید / از یار آشنا سخن آشنا شنید"

/* ---- countdown panel (nearest event + nearest holiday, live ticking if time given) ---- */
let countdownTickerId=null;
function nearestUpcoming(){
  const nowMs = Date.now();
  const todayJDN=gregorianToJDN(TODAY.gy,TODAY.gm,TODAY.gd);
  let bestEvent=null;
  state.events.forEach(ev=>{
    const occJDN=findNextEventOccurrence(ev, todayJDN);
    if(!occJDN) return;
    const g=jdnToGregorian(occJDN);
    let targetMs;
    if(ev.time){
      const [hh,mm]=ev.time.split(':').map(Number);
      targetMs=new Date(g.gy, g.gm-1, g.gd, hh, mm, 0).getTime();
    } else {
      targetMs=new Date(g.gy, g.gm-1, g.gd, 23,59,59).getTime();
    }
    if(targetMs>=nowMs-1000){
      if(!bestEvent || targetMs<bestEvent.targetMs) bestEvent={targetMs, title:ev.title};
    }
  });
  let bestHoliday=null;
  for(let i=0;i<200;i++){
    const g=jdnToGregorian(todayJDN+i);
    const hs=cellHolidays(g.gy,g.gm,g.gd).filter(h=>h.type==='official');
    if(hs.length){
      const targetMs=new Date(g.gy,g.gm-1,g.gd,23,59,59).getTime();
      if(targetMs>=nowMs-1000){ bestHoliday={targetMs, title:holidayName(hs[0])}; break; }
    }
  }
  return {bestEvent, bestHoliday};
}
function formatCountdown(ms){
  const t=T();
  if(ms<0) ms=0;
  const totalSec=Math.floor(ms/1000);
  const days=Math.floor(totalSec/86400);
  const hours=Math.floor((totalSec%86400)/3600);
  const mins=Math.floor((totalSec%3600)/60);
  const secs=totalSec%60;
  if(days>0) return days+t2('d')+" "+hours+t2('h');
  return hours+t2('h')+" "+mins+t2('mi')+" "+secs+t2('se');
}
function renderCountdownPanel(){
  const t=T();
  const {bestEvent, bestHoliday} = nearestUpcoming();
  const panel=document.getElementById("countdownPanel");
  if(!bestEvent && !bestHoliday){ panel.innerHTML=`<div class="cp-title">`+t2('countdownTitle')+`</div><div class="empty-note">`+t2('noUpcoming')+`</div>`; return; }
  let html=`<div class="cp-title">`+t2('countdownTitle')+`</div>`;
  if(bestEvent) html+=`<div class="countdown-row"><span>⏳ `+t2('nextEvent')+`: `+bestEvent.title+`</span><span class="countdown-time" data-target="`+bestEvent.targetMs+`">`+formatCountdown(bestEvent.targetMs-Date.now())+`</span></div>`;
  if(bestHoliday) html+=`<div class="countdown-row"><span>🌙 `+t2('nextHoliday')+`: `+bestHoliday.title+`</span><span class="countdown-time" data-target="`+bestHoliday.targetMs+`">`+formatCountdown(bestHoliday.targetMs-Date.now())+`</span></div>`;
  panel.innerHTML=html;
}
function startCountdownTicker(){
  if(countdownTickerId) clearInterval(countdownTickerId);
  countdownTickerId=setInterval(()=>{
    document.querySelectorAll(".countdown-time").forEach(el=>{
      const target=parseInt(el.dataset.target);
      el.textContent=formatCountdown(target-Date.now());
    });

}

function notifSupported(){ return typeof Notification !== 'undefined'; }
function updateNotifStatus(){
  const el = document.getElementById("notifStatusNote");
  if(!el) return;
  if(!notifSupported()){ el.textContent = t2('notifUnsupported'); return; }
  if(Notification.permission === 'granted') el.textContent = t2('notifGranted');
  else if(Notification.permission === 'denied') el.textContent = t2('notifDenied');
  else el.textContent = t2('notifDefault');
}
function playAlarmSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.22);
    });
  }catch(e){ /* audio not available, skip silently */ }
}
function fireAlarm(ev){
  playAlarmSound();
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  if(notifSupported() && Notification.permission==='granted'){
    try{
      const n = new Notification(t2('alarmFired')+": "+ev.title, {
        body: ev.location || ev.desc || "",
        tag: "skull-alarm-"+ev.id
      });
      n.onclick = ()=>{ window.focus(); n.close(); };
    }catch(e){}
  } else {
    // fallback: at least flash the tip box / bring attention within the page
    document.getElementById("tipBox").innerHTML = `<div class="tt">`+t2('alarmFired')+`</div><div>`+ev.title+`</div>`;
  }
}
const firedAlarms = new Set();
function scanAlarms(){
  const now = new Date();
  const gy=now.getFullYear(), gm=now.getMonth()+1, gd=now.getDate();
  const hh = String(now.getHours()).padStart(2,"0"), mm = String(now.getMinutes()).padStart(2,"0");
  const nowHM = hh+":"+mm;
  const todaysEvents = cellEvents(gy,gm,gd);
  todaysEvents.forEach(ev=>{
    if(!ev.notify || !ev.time) return;
    if(ev.time !== nowHM) return;
    const fireKey = ev.id+"-"+gy+"-"+gm+"-"+gd;
    if(firedAlarms.has(fireKey)) return;
    firedAlarms.add(fireKey);
    fireAlarm(ev);
  });
}
let alarmScannerId = null;
function startAlarmScanner(){
  if(alarmScannerId) clearInterval(alarmScannerId);
  alarmScannerId = setInterval(scanAlarms, 15000);
  scanAlarms();
}

function moonPhase(gy,gm,gd){
  const jdn = gregorianToJDN(gy,gm,gd);
  const synodic = 29.530588853;
  const refNew = 2451550.1; // known new moon JDN reference
  let days = (jdn - refNew) % synodic;
  if(days<0) days += synodic;
  const frac = days/synodic;
  const illumination = (1 - Math.cos(2*Math.PI*frac))/2;
  let phaseKey;
  if(frac<0.03 || frac>0.97) phaseKey='phaseNew';
  else if(frac<0.22) phaseKey='phaseWaxCr';
  else if(frac<0.28) phaseKey='phaseFirstQ';
  else if(frac<0.47) phaseKey='phaseWaxGib';
  else if(frac<0.53) phaseKey='phaseFull';
  else if(frac<0.72) phaseKey='phaseWanGib';
  else if(frac<0.78) phaseKey='phaseLastQ';
  else phaseKey='phaseWanCr';
  return {illumination, phaseKey, ageDays:days, waxing: frac<0.5};
}

function goMonth(delta){

document.getElementById("fullRestoreFile").addEventListener("change", (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!confirm(t2("restoreConfirm"))) return;
      if(Array.isArray(data.events)) state.events=data.events;
      if(data.notes && typeof data.notes==='object') state.notes=data.notes;
      if(data.todos && typeof data.todos==='object') state.todos=data.todos;
      if(data.prefs){
        const p=data.prefs;
        if(p.mode) state.mode=p.mode;
        if(p.fontSize) state.fontSize=p.fontSize;
        if(p.location) state.location=p.location;
        if(p.weekendPreset) state.weekendPreset=p.weekendPreset;
        if(p.lang) state.lang=p.lang;
        if(p.theme) state.theme=p.theme;
        if(p.country) state.country=p.country;
        if(p.calType) state.calType=p.calType;
        if(p.weekStart) state.weekStart=p.weekStart;
      }
      if(data.layers){
        if(data.layers.layers) state.layers=Object.assign(state.layers, data.layers.layers);
        if(data.layers.customLayers) state.customLayers=data.layers.customLayers;
      }
      document.body.dataset.mode = state.mode;
      const map={small:"87%",medium:"100%",large:"113%",xlarge:"128%"};
      document.documentElement.style.fontSize = map[state.fontSize]||"100%";
      await saveEvents(); await saveNotes(); await saveTodos(); await savePrefs(); await saveLayers();
      render();
    }catch(err){ console.error('restore failed', err); }
  };
  reader.readAsText(file);
  e.target.value='';
});

    Notification.requestPermission().then(updateNotifStatus);
  }
  if(isBirthday){
    const birthYearInput = parseInt(document.getElementById("evBirthYear").value);
    if(birthYearInput){
      let bg;
      if(state.calType==='jalali') bg=j2g(birthYearInput,m,d);

      newEv.birthGY=bg.gy;
      newEv.repeat='yearly';

        newEv.endGy=eg.gy; newEv.endGm=eg.gm; newEv.endGd=eg.gd;

  render();
});

(function(){
  let touchStartX=null, touchStartY=null;
  const gridWrap=document.querySelector(".grid-wrap");
  gridWrap.addEventListener("touchstart",(e)=>{
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
  },{passive:true});
  gridWrap.addEventListener("touchend",(e)=>{
    if(touchStartX===null) return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){
      const t=T();
      goMonth(t.rtl ? (dx>0? 1:-1) : (dx>0? -1:1));
    }
    touchStartX=null; touchStartY=null;
  },{passive:true});
})();

document.getElementById("exportIcalBtn").addEventListener("click", ()=>{
  function pad2(n){ return String(n).padStart(2,"0"); }
  function dstamp(gy,gm,gd){ return gy+pad2(gm)+pad2(gd); }
  const nowStamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const repMap = {yearly:"FREQ=YEARLY", monthly:"FREQ=MONTHLY", weekly:"FREQ=WEEKLY"};
  let lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Skull Calendar//EN","CALSCALE:GREGORIAN"];
  state.events.forEach(ev=>{
    lines.push("BEGIN:VEVENT");
    lines.push("UID:"+ev.id+"@skullcalendar");
    lines.push("DTSTAMP:"+nowStamp);
    lines.push("DTSTART;VALUE=DATE:"+dstamp(ev.gy,ev.gm,ev.gd));
    lines.push("SUMMARY:"+ev.title.replace(/[\n,;]/g," "));
    if(repMap[ev.repeat]) lines.push("RRULE:"+repMap[ev.repeat]);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='skull-calendar-events.ics'; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click", ()=>{
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change",(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(Array.isArray(imported)){
        const existingIds=new Set(state.events.map(ev=>ev.id));
        imported.forEach(ev=>{ if(ev && ev.gy && !existingIds.has(ev.id)) state.events.push(ev); });
        await saveEvents(); render();
      }
    }catch(err){ console.error('import failed', err); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* ---- live clock (HH:MM:SS.CC) ---- */
(function(){
  const mainEl=document.getElementById("clockMain");
  const centiEl=document.getElementById("clockCenti");
  function pad(n,len){ len=len||2; return String(n).padStart(len,"0"); }
  function tick(){
    const now=new Date();
    mainEl.textContent = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
    centiEl.textContent = "."+pad(now.getMilliseconds(),3);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ---- PWA-lite: generate a home-screen icon from the skull logo + inline manifest ---- */
(function(){
  try{
    const svgEl = document.querySelector(".logo-row svg");
    if(!svgEl) return;
    const svgString = new XMLSerializer().serializeToString(svgEl);
    const svgData = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgString)));
    const img = new Image();
    img.onload = function(){
      const size = 512;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      // rounded black background
      ctx.fillStyle = "#0b0b0d";
      ctx.beginPath();
      const r = size*0.18;
      ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r);
      ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r); ctx.closePath(); ctx.fill();
      // draw the skull logo centered with padding
      const pad = size*0.14;
      ctx.drawImage(img, pad, pad, size-pad*2, size-pad*2);
      const dataUrl = canvas.toDataURL("image/png");

      document.getElementById("favIcon").href = dataUrl;
      document.getElementById("touchIcon").href = dataUrl;

      const manifest = {
        name: "Skull Calendar - تقویم جمجمه",
        short_name: "Skull Calendar",
        start_url: ".",
        display: "standalone",
        background_color: "#0b0b0d",
        theme_color: "#0b0b0d",
        icons: [
          {src: dataUrl, sizes: "512x512", type: "image/png"},
          {src: dataUrl, sizes: "192x192", type: "image/png"}
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = manifestUrl;
      document.head.appendChild(link);
    };
    img.src = svgData;
  }catch(e){ console.error("icon/manifest setup failed", e); }
})();

/* ---- service worker for basic offline caching (only meaningful when actually hosted, not file://) ---- */
(function(){
  if(typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return; // service workers require http(s)
  try{
    const swSource = `
      const CACHE_NAME = 'skull-calendar-v1';
      self.addEventListener('install', (e) => {
        e.waitUntil(
          caches.open(CACHE_NAME).then((cache) => cache.add(self.registration.scope))
        );
        self.skipWaiting();
      });
      self.addEventListener('activate', (e) => { self.clients.claim(); });
      self.addEventListener('fetch', (e) => {
        if(e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then((cached) => {
            const fetchPromise = fetch(e.request).then((resp) => {
              if(resp && resp.status === 200){
                caches.open(CACHE_NAME).then((cache) => cache.put(e.request, resp.clone()));
              }
              return resp;
            }).catch(() => cached);
            return cached || fetchPromise;
          })
        );
      });
    `;
    const swBlob = new Blob([swSource], {type: 'text/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(()=>{ /* offline caching just won't be available; app still works fully online */ });
  }catch(e){ /* non-fatal */ }
})();

/* ---- real "Install App" prompt (Chrome/Edge/Android when hosted with HTTPS) ---- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn=document.getElementById("installAppBtn");
  if(btn) btn.style.display="block";
});
document.getElementById("installAppBtn").addEventListener("click", async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("installAppBtn").style.display="none";
});
window.addEventListener('appinstalled', ()=>{
  const btn=document.getElementById("installAppBtn");
  if(btn) btn.style.display="none";
});
