<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقویم جمجمه | Skull Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4af37; --gold-soft:#e8c766; --black:#0b0b0d; --black-2:#141416;
    --white:#f4f2ea; --gray:#57565f; --accent: var(--gold); --accent-dim: rgba(212,175,55,.18);
  }
  *{box-sizing:border-box;}
  body.theme-black{--accent:#d4af37;}
  body.theme-gold{--accent:#d4af37;}
  body.theme-purple{--accent:#9a5bd0;}
  body.theme-gray{--accent:#9a9aa3;}
  body.theme-green{--accent:#2f9e63;}
  body.theme-blue{--accent:#3d7bd9;}
  body.theme-red{--accent:#d9534f;}
  body.theme-white{--accent:#f4f2ea;}

  html,body{margin:0;padding:0;height:100%;background:var(--black);color:var(--white);
    font-family:'Inter','Vazirmatn',sans-serif; overflow-x:hidden;}
  body[data-script="fa"], body[data-script="ar"]{font-family:'Vazirmatn','Inter',sans-serif;}

  .bg-watermark{position:fixed; inset:0; z-index:0; opacity:.05; pointer-events:none;
    display:flex; align-items:center; justify-content:center;}
  .bg-watermark svg{width:70vmin;height:70vmin;}

  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; background:linear-gradient(180deg,#0b0b0d 0%, #101013 100%);
    box-shadow:0 0 60px rgba(0,0,0,.6);}

  header.top{padding:20px 20px 12px; text-align:center; border-bottom:1px solid rgba(212,175,55,.15);}
  .logo-row{display:flex; align-items:center; justify-content:center; gap:10px;}
  .logo-row svg{width:44px;height:44px;flex-shrink:0;}
  .app-name{font-family:'Cinzel','Vazirmatn',serif; font-weight:900; letter-spacing:1px;
    font-size:1.3rem; color:var(--accent); text-shadow:0 0 18px rgba(212,175,55,.25);}
  body[data-script="fa"] .app-name, body[data-script="ar"] .app-name{font-family:'Vazirmatn',sans-serif; font-weight:700;}
  .subtitle{font-size:.66rem; color:var(--gray); letter-spacing:2px; text-transform:uppercase; margin-top:2px;}

  nav.cal-tabs{display:flex; gap:6px; padding:12px 16px 0;}
  .tab-btn{flex:1; padding:9px 4px; text-align:center; background:transparent; color:var(--gray);
    border:1px solid rgba(255,255,255,.08); border-radius:10px; font-size:.76rem; cursor:pointer;
    transition:.2s; font-weight:600;}
  .tab-btn.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}

  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 4px;}
  .nav-arrow{width:34px;height:34px;border-radius:50%; border:1px solid rgba(255,255,255,.1);
    background:var(--black-2); color:var(--white); font-size:1rem; cursor:pointer; display:flex;
    align-items:center; justify-content:center; transition:.2s;}
  .nav-arrow:hover{border-color:var(--accent); color:var(--accent);}
  .month-title{font-family:'Cinzel','Vazirmatn',serif; font-weight:700; font-size:1rem; color:var(--white); text-align:center;}
  .month-sub{font-size:.65rem; color:var(--gray); text-align:center; margin-top:2px;}
  body[data-script="fa"] .month-title, body[data-script="ar"] .month-title{font-family:'Vazirmatn',sans-serif;}

  .grid-wrap{padding:6px 16px 8px;}
  .weekday-row, .day-row{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .weekday-row div{text-align:center; font-size:.66rem; color:var(--gray); padding:5px 0; font-weight:600;}
  .day-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; font-size:.82rem; color:var(--white); cursor:pointer; position:relative;
    background:rgba(255,255,255,.02); border:1px solid transparent; transition:.15s;}
  .day-cell.empty{visibility:hidden;}
  .day-cell:hover{border-color:rgba(212,175,55,.4);}
  .day-cell.weekend-day{color:#5b9bf0; font-weight:700;}
  .day-cell.holiday-day{color:#e6473f; font-weight:800;}
  .day-cell.today{border-color:var(--accent); color:var(--accent); font-weight:800;}
  .day-cell.selected{background:var(--accent); color:#0b0b0d; font-weight:800;}
  .dot-row{position:absolute; bottom:3px; display:flex; gap:2px;}
  .dot{width:4px;height:4px;border-radius:50%;}
  .dot.holiday{background:#d9534f;}
  .dot.event{background:#3d7bd9;}
  .day-cell.selected .dot.holiday, .day-cell.selected .dot.event{background:#0b0b0d;}

  .detail-panel{margin:10px 16px 0; padding:14px; border-radius:14px; background:var(--black-2);
    border:1px solid rgba(212,175,55,.15); font-size:.8rem;}
  .detail-row{display:flex; justify-content:space-between; padding:5px 0; color:var(--white);}
  .detail-row span:first-child{color:var(--gray);}
  .holiday-tag{display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:20px;
    background:rgba(217,83,79,.15); color:#e88; font-size:.72rem; border:1px solid rgba(217,83,79,.3);}
  .event-tag{display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:20px;
    background:rgba(61,123,217,.15); color:#8ab4e8; font-size:.72rem; border:1px solid rgba(61,123,217,.3);}

  .month-holidays{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(212,175,55,.05);
    border:1px solid rgba(212,175,55,.12); font-size:.78rem;}
  .month-holidays .mh-title{color:var(--accent); font-weight:700; margin-bottom:6px;}
  .mh-item{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.06);}
  .mh-item:last-child{border-bottom:none;}
  .mh-item span:last-child{color:var(--gray); font-size:.72rem;}

  footer.bottom-bar{margin-top:auto; display:flex; border-top:1px solid rgba(212,175,55,.15); flex-wrap:wrap;}
  .bottom-btn{flex:1; min-width:60px; padding:12px 4px; text-align:center; color:var(--gray); background:none; border:none;
    font-size:.66rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bottom-btn:hover{color:var(--accent);}

  .sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none;
    align-items:flex-end; justify-content:center;}
  .sheet-overlay.open{display:flex;}
  .sheet{width:100%; max-width:480px; background:#131316; border-radius:20px 20px 0 0; padding:20px;
    max-height:85vh; overflow-y:auto; border-top:1px solid rgba(212,175,55,.25); position:relative;}
  .sheet h3{font-family:'Cinzel','Vazirmatn',serif; color:var(--accent); margin:0 0 14px; font-size:1rem;}
  body[data-script="fa"] .sheet h3, body[data-script="ar"] .sheet h3{font-family:'Vazirmatn',sans-serif;}
  .sheet-close{position:absolute; top:16px; inset-inline-end:18px; background:none; border:none; color:var(--gray);
    font-size:1.3rem; cursor:pointer;}
  .field-label{font-size:.7rem; color:var(--gray); margin:14px 0 6px; text-transform:uppercase; letter-spacing:1px;}
  select.field, input.field{width:100%; padding:10px; border-radius:10px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.88rem; font-family:inherit;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:36px; height:36px; border-radius:50%; cursor:pointer; border:2px solid transparent; position:relative;}
  .swatch.selected{border-color:var(--white); box-shadow:0 0 0 2px var(--accent);}
  .about-box{margin-top:16px; padding:14px; border-radius:12px; background:rgba(212,175,55,.06);
    border:1px solid rgba(212,175,55,.2); font-size:.82rem; line-height:1.8;}
  .about-box b{color:var(--accent);}
  .subtab-row{display:flex; gap:6px; margin-bottom:12px;}
  .subtab{flex:1; padding:8px; text-align:center; border-radius:8px; background:var(--black-2); color:var(--gray);
    font-size:.76rem; cursor:pointer; border:1px solid rgba(255,255,255,.08);}
  .subtab.active{color:var(--accent); border-color:var(--accent); background:var(--accent-dim);}
  .btn{width:100%; padding:11px; border-radius:10px; background:var(--accent); color:#0b0b0d; border:none;
    font-weight:700; font-size:.85rem; cursor:pointer; margin-top:8px;}
  .btn.secondary{background:var(--black-2); color:var(--white); border:1px solid rgba(255,255,255,.14);}
  .result-box{margin-top:14px; padding:14px; border-radius:12px; background:var(--black-2);
    border:1px solid rgba(212,175,55,.2); font-size:.85rem; line-height:1.9;}
  .result-box b{color:var(--accent); font-size:1.05rem;}
  .event-item{display:flex; justify-content:space-between; align-items:center; padding:10px;
    border-radius:10px; background:var(--black-2); margin-bottom:8px; border:1px solid rgba(255,255,255,.06);}
  .event-item .ei-txt{font-size:.82rem;}
  .event-item .ei-date{font-size:.7rem; color:var(--gray);}
  .del-btn{background:none; border:none; color:#d9534f; font-size:1.1rem; cursor:pointer; padding:4px 8px;}
  .empty-note{color:var(--gray); font-size:.8rem; text-align:center; padding:14px 0;}
  .note-small{font-size:.7rem; color:var(--gray); margin-top:10px; line-height:1.6;}

  .icon-btn-row{display:flex; gap:8px; margin-top:8px;}
  .icon-btn{padding:6px 12px; border-radius:20px; background:var(--black-2); color:var(--accent);
    border:1px solid rgba(212,175,55,.25); font-size:.72rem; cursor:pointer; display:flex; align-items:center; gap:4px;}
  .tip-box{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.03);
    border:1px dashed rgba(255,255,255,.12); font-size:.78rem; line-height:1.7; color:var(--white);}
  .tip-box .tt{color:var(--accent); font-weight:700; margin-bottom:4px;}
  .tip-box .td{color:var(--gray); font-size:.66rem; margin-top:6px;}

  .moon-visual{display:flex; align-items:center; gap:16px; margin-top:10px;}
  .moon-disc{width:70px;height:70px;border-radius:50%; background:#1a1a1d; position:relative; overflow:hidden; flex-shrink:0;
    box-shadow:inset 0 0 12px rgba(0,0,0,.6);}
  .moon-disc .lit{position:absolute; top:0; height:100%; background:#e8dfc0;}
  .moon-stats{font-size:.82rem; line-height:1.9;}
  .moon-stats b{color:var(--accent);}

  .color-dot-select{display:flex; gap:8px; margin-top:2px;}
  .cdot{width:26px;height:26px;border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .cdot.selected{border-color:var(--white);}

  .share-card{border-radius:16px; padding:20px; background:linear-gradient(160deg,#141416,#0b0b0d);
    border:1px solid rgba(212,175,55,.3); text-align:center;}
  .share-card .sc-name{font-family:'Cinzel','Vazirmatn',serif; color:var(--gold); font-size:.85rem; letter-spacing:1px; margin-bottom:10px;}
  .share-card .sc-line{color:var(--white); font-size:.9rem; padding:4px 0;}
  .share-card .sc-line b{color:var(--gold);}
  .share-card .sc-hol{color:#e88; font-size:.76rem; margin-top:8px;}
  textarea.field{width:100%; min-height:70px; border-radius:10px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.78rem; padding:10px; font-family:inherit;}

  body[data-mode="light"]{ --black:#f3f1ea; --black-2:#ffffff; --white:#1c1b18; --gray:#6b6a63; }
  body[data-mode="light"] .app{ background:linear-gradient(180deg,#f6f4ec 0%, #eeece2 100%); box-shadow:0 0 40px rgba(0,0,0,.12); }
  body[data-mode="light"] .day-cell{ background:rgba(0,0,0,.02); }
  body[data-mode="light"] .bg-watermark{ opacity:.04; }
  body[data-mode="light"] .sheet{ background:#fdfcf7; }
  body[data-mode="light"] .month-holidays, body[data-mode="light"] .detail-panel, body[data-mode="light"] .tip-box{
    background:rgba(0,0,0,.02); }

  .mode-toggle-row{display:flex; gap:8px; margin-top:6px;}
  .mode-btn{flex:1; padding:9px; text-align:center; border-radius:10px; background:var(--black-2); color:var(--gray);
    border:1px solid rgba(255,255,255,.1); font-size:.78rem; cursor:pointer;}
  .mode-btn.active{color:var(--accent); border-color:var(--accent); background:var(--accent-dim);}

  .countdown-panel{margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:rgba(61,123,217,.06);
    border:1px solid rgba(61,123,217,.2); font-size:.78rem;}
  .countdown-panel .cp-title{color:#8ab4e8; font-weight:700; margin-bottom:6px;}
  .countdown-row{display:flex; justify-content:space-between; align-items:center; padding:4px 0;}
  .countdown-time{font-family:'Cinzel','Vazirmatn',serif; font-weight:700; color:var(--white); letter-spacing:1px;}

  .jump-row{display:flex; gap:6px; align-items:center;}
  .jump-row input{width:56px; padding:7px; border-radius:8px; background:var(--black-2); color:var(--white);
    border:1px solid rgba(255,255,255,.12); font-size:.8rem; text-align:center;}
  .jump-go{padding:7px 12px; border-radius:8px; background:var(--accent); color:#0b0b0d; border:none; font-weight:700; font-size:.78rem; cursor:pointer;}

  .note-dot{background:#9a9aa3 !important;}

  .loc-row{display:flex; gap:8px; margin-top:4px;}
  .loc-btn{flex:1; padding:9px; text-align:center; border-radius:10px; background:var(--black-2); color:var(--accent);
    border:1px solid rgba(212,175,55,.25); font-size:.76rem; cursor:pointer;}
  .prayer-list{margin-top:14px;}
  .prayer-item{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px;
    background:var(--black-2); margin-bottom:6px; border:1px solid rgba(255,255,255,.06); font-size:.85rem;}
  .prayer-item.current{border-color:var(--accent); background:var(--accent-dim);}
  .prayer-item .pi-name{color:var(--white);}
  .prayer-item .pi-time{color:var(--accent); font-weight:700; font-family:'Cinzel','Vazirmatn',serif;}
  .qibla-box{margin-top:16px; display:flex; align-items:center; gap:16px;}
  .compass-wrap{width:90px;height:90px;border-radius:50%; border:2px solid rgba(212,175,55,.3); position:relative; flex-shrink:0;
    background:radial-gradient(circle, rgba(212,175,55,.05), transparent 70%);}
  .compass-n{position:absolute; top:4px; left:50%; transform:translateX(-50%); font-size:.6rem; color:var(--gray);}
  .compass-arrow{position:absolute; top:50%; left:50%; width:3px; height:38px; background:var(--accent);
    transform-origin:bottom center; border-radius:2px 2px 0 0;}
  .qibla-stats{font-size:.82rem; line-height:1.9;}
  .qibla-stats b{color:var(--accent);}
  .loc-manual{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;}
  @media (max-width:360px){ .app-name{font-size:1.05rem;} .bottom-btn{font-size:.6rem;} }
</style>
</head>
<body class="theme-black" data-script="fa">

<div class="bg-watermark" id="watermark"></div>

<div class="app">
  <header class="top">
    <div class="logo-row">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 42 C20 30 14 14 6 4 M32 42 C24 26 20 10 16 2 M38 34 C34 20 32 8 30 0 M32 42 C16 40 6 34 2 26" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M88 42 C100 30 106 14 114 4 M88 42 C96 26 100 10 104 2 M82 34 C86 20 88 8 90 0 M88 42 C104 40 114 34 118 26" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M60 34 C40 34 30 50 32 66 C33 78 40 88 44 96 L48 108 L54 100 L60 110 L66 100 L72 108 L76 96 C80 88 87 78 88 66 C90 50 80 34 60 34 Z"
          fill="#0b0b0d" stroke="#d4af37" stroke-width="2.4"/>
        <ellipse cx="46" cy="58" rx="8" ry="10" fill="#0b0b0d" stroke="#d4af37" stroke-width="2.2"/>
        <ellipse cx="74" cy="58" rx="8" ry="10" fill="#0b0b0d" stroke="#d4af37" stroke-width="2.2"/>
        <path d="M60 66 L55 82 L65 82 Z" fill="#0b0b0d" stroke="#d4af37" stroke-width="2"/>
        <path d="M46 92 L48 100 M52 95 L52 103 M60 96 L60 104 M68 95 L68 103 M74 92 L72 100" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="app-name" id="appNameLbl">تقویم جمجمه</div>
        <div class="subtitle" id="subtitleLbl">Skull Calendar</div>
      </div>
    </div>
  </header>

  <nav class="cal-tabs" id="calTabs">
    <button class="tab-btn active" data-cal="jalali"></button>
    <button class="tab-btn" data-cal="gregorian"></button>
    <button class="tab-btn" data-cal="hijri"></button>
  </nav>

  <div class="nav-row">
    <button class="nav-arrow" id="prevBtn">‹</button>
    <div>
      <div class="month-title" id="monthTitle"></div>
      <div class="month-sub" id="monthSub"></div>
    </div>
    <button class="nav-arrow" id="jumpBtn" title="jump">🎯</button>
    <button class="nav-arrow" id="nextBtn">›</button>
  </div>

  <div class="grid-wrap">
    <div class="weekday-row" id="weekdayRow"></div>
    <div class="day-row" id="dayGrid" style="margin-top:4px;"></div>
  </div>

  <div class="detail-panel" id="detailPanel"></div>
  <div style="margin:8px 16px 0;" class="icon-btn-row">
    <button class="icon-btn" id="speakBtn">🔊 <span id="speakLbl"></span></button>
    <button class="icon-btn" id="shareBtn">🔗 <span id="shareLbl"></span></button>
    <button class="icon-btn" id="noteBtn">📝 <span id="noteLbl"></span></button>
  </div>
  <div class="tip-box" id="tipBox"></div>
  <div class="countdown-panel" id="countdownPanel"></div>
  <div class="month-holidays" id="monthHolidaysPanel"></div>

  <footer class="bottom-bar">
    <button class="bottom-btn" id="todayBtn">📅 <span id="todayLbl"></span></button>
    <button class="bottom-btn" id="prayerBtn">🕌 <span id="prayerLbl"></span></button>
    <button class="bottom-btn" id="toolsBtn">🧮 <span id="toolsLbl"></span></button>
    <button class="bottom-btn" id="eventsBtn">🔔 <span id="eventsLbl"></span></button>
    <button class="bottom-btn" id="holidaysBtn">🌍 <span id="holidaysLbl"></span></button>
    <button class="bottom-btn" id="langBtn">🌐 <span id="langLbl"></span></button>
    <button class="bottom-btn" id="themeBtn">🎨 <span id="themeLbl"></span></button>
    <button class="bottom-btn" id="aboutBtn">☠ <span id="aboutLbl"></span></button>
  </footer>
</div>

<!-- LANGUAGE SHEET -->
<div class="sheet-overlay" id="langSheet">
  <div class="sheet">
    <button class="sheet-close" data-close="langSheet">✕</button>
    <h3 id="langSheetTitle"></h3>
    <select class="field" id="langSelect"></select>
    <div class="field-label" id="weekStartLbl"></div>
    <select class="field" id="weekStartSelect"></select>
    <div class="field-label" id="fontSizeLbl"></div>
    <select class="field" id="fontSizeSelect"></select>
    <div class="field-label" id="weekendLbl"></div>
    <select class="field" id="weekendSelect"></select>
  </div>
</div>

<!-- THEME SHEET -->
<div class="sheet-overlay" id="themeSheet">
  <div class="sheet">
    <button class="sheet-close" data-close="themeSheet">✕</button>
    <h3 id="themeSheetTitle"></h3>
    <div class="swatches" id="swatchesRow"></div>
    <div class="field-label" id="modeLbl"></div>
    <div class="mode-toggle-row">
      <div class="mode-btn active" id="modeDarkBtn" data-mode="dark"></div>
      <div class="mode-btn" id="modeLightBtn" data-mode="light"></div>
    </div>
  </div>
</div>

<!-- JUMP SHEET -->
<div class="sheet-overlay" id="jumpSheet">
  <div class="sheet">
    <button class="sheet-close" data-close="jumpSheet">✕</button>
    <h3 id="jumpSheetTitle"></h3>
    <div class="jump-row">
      <input id="jumpYear" type="number" placeholder="Y">
      <input id="jumpMonth" type="number" placeholder="M" min="1" max="12">
      <input id="jumpDay" type="number" placeholder="D" min="1" max="31">
      <button class="jump-go" id="jumpGoBtn"></button>
    </div>
  </div>
</div>

<!-- NOTE SHEET -->
<div class="sheet-overlay" id="noteSheet">
  <div class="sheet">
    <button class="sheet-close" data-close="noteSheet">✕</button>
    <h3 id="noteSheetTitle"></h3>
    <textarea class="field" id="noteTextarea" rows="5"></textarea>
    <button class="btn" id="noteSaveBtn"></button>
  </div>
</div>

<!-- PRAYER TIMES SHEET -->
<div class="sheet-overlay" id="prayerSheet">
  <div class="sheet">
    <button class="sheet-close" data-close="prayerSheet">✕</button>
    <h3 id="prayerSheetTitle"></h3>
    <div class="field-label" id="prayerDateLbl"></div>
    <div class="field-label" id="locLbl" style="margin-top:14px;"></div>
    <div class="loc-row">
      <button class="loc-btn" id="autoLocBtn">📍 <span id="autoLocLbl"></span></button>
    </div>
    <select class="field" id="citySelect" style="margin-top:8px;"></select>

<script>
/* ================= date conversion engine ================= */
function div_(a,b){return Math.trunc(a/b);}
function mod_(a,b){return a-Math.trunc(a/b)*b;}

function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm, jump=0, leap, n, i, leapG, march;
  for(i=1;i<bl;i++){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ=leapJ+div_(jump,33)*8+div_(mod_(jump,33),4); jp=jm; }
  n=jy-jp;
  leapJ=leapJ+div_(n,33)*8+div_(mod_(n,33)+3,4);
  if(mod_(jump,33)===4 && jump-n===4) leapJ+=1;
  leapG=div_(gy,4)-div_((div_(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div_(jump+4,33)*33;
  leap=mod_(mod_(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function g2d(gy,gm,gd){
  var d=div_((gy+div_(gm-8,6)+100100)*1461,4)+div_(153*mod_(gm+9,12)+2,5)+gd-34840408;
  d=d-div_(div_(gy+100100+div_(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div_(div_(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div_(mod_(j,1461),4)*5+308;
  var gd=div_(mod_(i,153),5)+1;
  var gm=mod_(div_(i,153),12)+1;
  var gy=div_(j,1461)-100100+div_(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div_(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), jdn1f=g2d(gy,3,r.march), jd, jm, k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){ jm=1+div_(k,31); jd=mod_(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else k-=186;

}
function g2j(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function j2g(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }

function gregorianToJDN(y,m,d){
  var a=Math.trunc((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  return d+Math.trunc((153*m2+2)/5)+365*y2+Math.trunc(y2/4)-Math.trunc(y2/100)+Math.trunc(y2/400)-32045;
}
function jdnToGregorian(jdn){
  var a=jdn+32044, b=Math.trunc((4*a+3)/146097), c=a-Math.trunc((146097*b)/4);
  var d=Math.trunc((4*c+3)/1461), e=c-Math.trunc((1461*d)/4), m=Math.trunc((5*e+2)/153);
  var day=e-Math.trunc((153*m+2)/5)+1, month=m+3-12*Math.trunc(m/10), year=100*b+d-4800+Math.trunc(m/10);

}
function jdnToHijri(jdn){
  var l=jdn-1948440+10632, n=Math.trunc((l-1)/10631);
  l=l-10631*n+354;
  var j=(Math.trunc((10985-l)/5316))*(Math.trunc((50*l)/17719))+(Math.trunc(l/5670))*(Math.trunc((43*l)/15238));
  l=l-(Math.trunc((30-j)/15))*(Math.trunc((17719*j)/50))-(Math.trunc(j/16))*(Math.trunc((15238*j)/43))+29;
  var m=Math.trunc((24*l)/709), d=l-Math.trunc((709*m)/24), y=30*n+j-30;

function hijriToJDN(y,m,d){

function daysInJalaliMonth(jy,jm){

function daysInGregorianMonth(gy,gm){ return new Date(gy,gm,0).getDate(); }

  const start=hijriToJDN(hy,hm,1);
  const nextY = hm===12? hy+1: hy;
  const nextM = hm===12? 1: hm+1;
  const end=hijriToJDN(nextY,nextM,1);
  return end-start;
}
function weekdayOfGregorian(gy,gm,gd){ return new Date(gy,gm-1,gd).getDay(); }

/* ================= prayer times (NOAA solar position + Univ. of Tehran angles) ================= */
function deg2rad(d){return d*Math.PI/180;}
function rad2deg(r){return r*180/Math.PI;}
function sinD(d){return Math.sin(deg2rad(d));}
function cosD(d){return Math.cos(deg2rad(d));}
function tanD(d){return Math.tan(deg2rad(d));}
function acosD(x){return rad2deg(Math.acos(Math.max(-1,Math.min(1,x))));}
function atanD(x){return rad2deg(Math.atan(x));}
function dayOfYear(y,m,d){
  const start=Date.UTC(y,0,1), cur=Date.UTC(y,m-1,d);
  return Math.round((cur-start)/86400000)+1;
}
function sunCalc(y,m,d){
  const N=dayOfYear(y,m,d);
  const gamma = 2*Math.PI/365*(N-1);
  const decl = 0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
    - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
    - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma);
  const eqtime = 229.18*(0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
    - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma));
  return {decl: rad2deg(decl), eqtime};
}
function hourAngle(lat, decl, zenith){
  const cosH = (cosD(zenith) - sinD(lat)*sinD(decl)) / (cosD(lat)*cosD(decl));
  if(cosH>1 || cosH<-1) return null;
  return acosD(cosH);
}
function minToHHMM(min){
  if(min===null) return "--:--";
  min = ((min%1440)+1440)%1440;
  const hh=Math.floor(min/60), mm=Math.round(min%60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}
function computePrayerTimes(y,m,d,lat,lon,tz){
  const {decl, eqtime} = sunCalc(y,m,d);
  const solarNoonMin = 720 - 4*lon - eqtime + 60*tz;
  const ha_sun = hourAngle(lat,decl,90.833);
  const ha_fajr = hourAngle(lat,decl,90+17.7);
  const ha_isha = hourAngle(lat,decl,90+14);
  const ha_maghrib = hourAngle(lat,decl,90+4.5);
  const asrAlt = atanD(1/(1+Math.abs(tanD(lat-decl))));
  const ha_asr = hourAngle(lat,decl,90-asrAlt);

  const dhuhr = solarNoonMin;
  const sunrise = ha_sun!==null? solarNoonMin - 4*ha_sun : null;
  const sunset = ha_sun!==null? solarNoonMin + 4*ha_sun : null;
  const fajr = ha_fajr!==null? solarNoonMin - 4*ha_fajr : null;
  const isha = ha_isha!==null? solarNoonMin + 4*ha_isha : null;
  const maghrib = ha_maghrib!==null? solarNoonMin + 4*ha_maghrib : null;
  const asr = ha_asr!==null? solarNoonMin + 4*ha_asr : null;
  const midnightMin = (sunset!==null && fajr!==null) ? sunset + (1440-(sunset-fajr))/2 : null;

  return {
    fajrMin:fajr, sunriseMin:sunrise, dhuhrMin:dhuhr, asrMin:asr, sunsetMin:sunset, maghribMin:maghrib, ishaMin:isha, midnightMin:midnightMin,
    fajr: minToHHMM(fajr), sunrise: minToHHMM(sunrise), dhuhr: minToHHMM(dhuhr), asr: minToHHMM(asr),
    sunset: minToHHMM(sunset), maghrib: minToHHMM(maghrib), isha: minToHHMM(isha), midnight: minToHHMM(midnightMin)
  };
}
function qiblaBearing(lat,lon){
  const dLon = KAABA.lon - lon;
  const bearing = rad2deg(Math.atan2(Math.sin(deg2rad(dLon)), Math.cos(deg2rad(lat))*Math.tan(deg2rad(KAABA.lat)) - Math.sin(deg2rad(lat))*Math.cos(deg2rad(dLon))));
  return (bearing+360)%360;
}
function qiblaDistanceKm(lat,lon){
  const R=6371;
  const dLat=deg2rad(KAABA.lat-lat), dLon=deg2rad(KAABA.lon-lon);
  const a=Math.sin(dLat/2)**2 + Math.cos(deg2rad(lat))*Math.cos(deg2rad(KAABA.lat))*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

const WEEKEND_PRESETS = {
  fri:[5], sat:[6], thu_fri:[4,5], fri_sat:[5,6], sat_sun:[6,0], sun:[0]
};
function isWeekend(gy,gm,gd){
  const wd=weekdayOfGregorian(gy,gm,gd);
  return (WEEKEND_PRESETS[state.weekendPreset]||[5]).includes(wd);
}

function todayParts(){
  const t=new Date();
  const gy=t.getFullYear(), gm=t.getMonth()+1, gd=t.getDate();
  const j=g2j(gy,gm,gd); const h=g2h(gy,gm,gd);
  return {gy,gm,gd, jy:j.jy,jm:j.jm,jd:j.jd, hy:h.hy,hm:h.hm,hd:h.hd};
}
const TODAY=todayParts();
state.viewJY=TODAY.jy; state.viewJM=TODAY.jm;
state.viewGY=TODAY.gy; state.viewGM=TODAY.gm;
state.viewHY=TODAY.hy; state.viewHM=TODAY.hm;

function T(){ return LANGS[state.lang]; }
function t2(key){ return LANGS[state.lang][key] !== undefined ? LANGS[state.lang][key] : LANGS.en[key]; }
function holidayName(hd){ return hd.name[state.lang] || hd.name.en || hd.name.fa; }
const EVENT_COLORS = [
  {key:'gold', color:'#d4af37'}, {key:'blue', color:'#3d7bd9'}, {key:'green', color:'#2f9e63'}, {key:'red', color:'#d9534f'}
];

function dateKey(gy,gm,gd){ return gy+"-"+gm+"-"+gd; }
function cellHolidays(gy,gm,gd){
  const j=g2j(gy,gm,gd), h=g2h(gy,gm,gd);
  let list=[];
  INTL_DAYS.forEach(hd=>{ if(hd.m===gm && hd.d===gd) list.push(hd); });
  const country = CH[state.country]||[];
  country.forEach(hd=>{
    if(hd.sys==='g' && hd.m===gm && hd.d===gd) list.push(hd);
    if(hd.sys==='j' && hd.m===j.jm && hd.d===j.jd) list.push(hd);
    if(hd.sys==='h' && hd.m===h.hm && hd.d===h.hd) list.push(hd);
  });
  return list;
}
function cellEvents(gy,gm,gd){
  const cellJDN = gregorianToJDN(gy,gm,gd);
  return state.events.filter(ev=>{
    const evJDN = gregorianToJDN(ev.gy,ev.gm,ev.gd);
    if(ev.repeat==='none') return ev.gy===gy && ev.gm===gm && ev.gd===gd;
    if(cellJDN < evJDN) return false;
    if(ev.repeat==='yearly') return ev.gm===gm && ev.gd===gd;
    if(ev.repeat==='monthly') return ev.gd===gd;
    if(ev.repeat==='weekly') return (cellJDN-evJDN)%7===0;
    return false;
  });
}

    const d=document.createElement("div"); d.textContent=t.weekdays[(ws+i)%7]; wr.appendChild(d);
  }

  const grid=document.getElementById("dayGrid");
  grid.innerHTML="";
  let monthName, year, firstWeekday, numDays, cellsMeta=[], isLeap=null;

  if(state.calType==="jalali"){
    monthName=t.monthsJ[state.viewJM-1]; year=state.viewJY;
    numDays=daysInJalaliMonth(state.viewJY,state.viewJM);
    isLeap = state.viewJM===12 ? jalCal(state.viewJY).leap===1 : null;
    const g1=j2g(state.viewJY,state.viewJM,1);
    firstWeekday=weekdayOfGregorian(g1.gy,g1.gm,g1.gd);
    for(let d=1; d<=numDays; d++) cellsMeta.push({label:d, jy:state.viewJY,jm:state.viewJM,jd:d});
  } else if(state.calType==="gregorian"){
    monthName=t.monthsG[state.viewGM-1]; year=state.viewGY;
    numDays=daysInGregorianMonth(state.viewGY,state.viewGM);
    firstWeekday=weekdayOfGregorian(state.viewGY,state.viewGM,1);
    for(let d=1; d<=numDays; d++) cellsMeta.push({label:d, gy:state.viewGY,gm:state.viewGM,gd:d});
  } else {
    monthName=t.monthsH[state.viewHM-1]; year=state.viewHY;
    numDays=daysInHijriMonth(state.viewHY,state.viewHM);
    const g1=jdnToGregorian(hijriToJDN(state.viewHY,state.viewHM,1));
    firstWeekday=weekdayOfGregorian(g1.gy,g1.gm,g1.gd);
    for(let d=1; d<=numDays; d++) cellsMeta.push({label:d, hy:state.viewHY,hm:state.viewHM,hd:d});
  }
  document.getElementById("monthTitle").textContent = monthName+" "+year + (state.calType==='jalali'? " ("+t2('zodiac')[state.viewJM-1]+")" : "");

  if(isLeap!==null) subTxt += " · "+(isLeap? t.leapYes : t.leapNo);
  document.getElementById("monthSub").textContent = subTxt;

  const offset = (firstWeekday - ws + 7)%7;
  for(let i=0;i<offset;i++){ const e=document.createElement("div"); e.className="day-cell empty"; grid.appendChild(e); }

  let monthHolidaysCollected=[];
  let holidayDaySet=new Set(), weekendDayCount=0, totalDaysCount=cellsMeta.length;
  cellsMeta.forEach(meta=>{
    const cell=document.createElement("div");
    cell.className="day-cell";
    const numSpan=document.createElement("div"); numSpan.textContent=meta.label; cell.appendChild(numSpan);

    let gy,gm,gd;
    if(meta.jy!==undefined){ const g=j2g(meta.jy,meta.jm,meta.jd); gy=g.gy;gm=g.gm;gd=g.gd; }
    else if(meta.gy!==undefined){ gy=meta.gy;gm=meta.gm;gd=meta.gd; }
    else { const g=jdnToGregorian(hijriToJDN(meta.hy,meta.hm,meta.hd)); gy=g.gy;gm=g.gm;gd=g.gd; }

    if(gy===TODAY.gy && gm===TODAY.gm && gd===TODAY.gd) cell.classList.add("today");
    if(state.selected && state.selected.gy===gy && state.selected.gm===gm && state.selected.gd===gd) cell.classList.add("selected");

    const hols=cellHolidays(gy,gm,gd);
    const evs=cellEvents(gy,gm,gd);
    const wknd=isWeekend(gy,gm,gd);
    if(wknd){ cell.classList.add("weekend-day"); weekendDayCount++; }
    if(hols.length){ cell.classList.add("holiday-day"); holidayDaySet.add(meta.label); }
    const hasNote = !!state.notes[dateKey(gy,gm,gd)];
    if(hols.length || evs.length || hasNote){
      const dotRow=document.createElement("div"); dotRow.className="dot-row";
      if(hols.length){ const dt=document.createElement("div"); dt.className="dot holiday"; dotRow.appendChild(dt); }

function genericAge(by,bm,bd, ty,tm,td, daysInMonthFn){
  let years=ty-by, months=tm-bm, days=td-bd;

  return {years,months,days};

function findNextEventOccurrence(ev, fromJDN){
  const evJDN = gregorianToJDN(ev.gy,ev.gm,ev.gd);
  if(ev.repeat==='none') return evJDN>=fromJDN? evJDN : null;
  if(evJDN>=fromJDN) return evJDN;
  if(ev.repeat==='weekly'){
    const diff=(fromJDN-evJDN)%7;
    return fromJDN + (diff===0?0:7-diff);
  }
  if(ev.repeat==='monthly'){
    let g=jdnToGregorian(fromJDN);
    let cand=gregorianToJDN(g.gy,g.gm,ev.gd<=daysInGregorianMonth(g.gy,g.gm)?ev.gd:daysInGregorianMonth(g.gy,g.gm));
    if(cand<fromJDN){ let ny=g.gm===12?g.gy+1:g.gy, nm=g.gm===12?1:g.gm+1; cand=gregorianToJDN(ny,nm,Math.min(ev.gd,daysInGregorianMonth(ny,nm))); }
    return cand;
  }
  if(ev.repeat==='yearly'){
    let g=jdnToGregorian(fromJDN);
    let cand=gregorianToJDN(g.gy,ev.gm,ev.gd);
    if(cand<fromJDN) cand=gregorianToJDN(g.gy+1,ev.gm,ev.gd);
    return cand;
  }
  return null;
}
function renderTip(){
  const t=T();
  const sel = state.selected || {gy:TODAY.gy,gm:TODAY.gm,gd:TODAY.gd};
  const hols=cellHolidays(sel.gy,sel.gm,sel.gd);
  const evs=cellEvents(sel.gy,sel.gm,sel.gd);
  const wd=weekdayOfGregorian(sel.gy,sel.gm,sel.gd);
  const todayJDN=gregorianToJDN(TODAY.gy,TODAY.gm,TODAY.gd);
  let msg;
  if(evs.length){ msg=t2('tip_hasEvent').replace('{name}', evs.map(e=>e.title).join('، ')); }
  else if(hols.length){ msg=t2('tip_holiday').replace('{name}', hols.map(holidayName).join('، ')); }
  else if(evs.length>=2){ msg=t2('tip_busy'); }
  else {
    // countdown to nearest upcoming personal event (only when viewing today)
    let nearestEv=null;
    state.events.forEach(ev=>{
      const occ=findNextEventOccurrence(ev, todayJDN+1);
      if(occ && (!nearestEv || occ<nearestEv.occ)) nearestEv={occ, ev};
    });
    let nearestHol=null;
    for(let i=1;i<200;i++){
      const g=jdnToGregorian(todayJDN+i);
      const hs=cellHolidays(g.gy,g.gm,g.gd);
      if(hs.length){ nearestHol={n:i, name:holidayName(hs[0])}; break; }
    }
    if(nearestEv && nearestEv.occ-todayJDN<=5){
      msg=t2('tip_countdownEvent').replace('{n}', nearestEv.occ-todayJDN).replace('{name}', nearestEv.ev.title);
    } else if(nearestHol && nearestHol.n<=5){
      msg=t2('tip_countdownHoliday').replace('{n}', nearestHol.n).replace('{name}', nearestHol.name);
    } else if(wd===4 || wd===5){
      msg=t2('tip_weekend');
    } else {
      const mp=moonPhase(sel.gy,sel.gm,sel.gd);
      if(mp.phaseKey==='phaseFull') msg=t2('tip_moonFull');
      else if(mp.phaseKey==='phaseNew') msg=t2('tip_moonNew');
      else msg=t2('tip_rotate')[wd];
    }
  }
  document.getElementById("tipBox").innerHTML =
    `<div class="tt">`+t2('tipTitle')+`</div><div>`+msg+`</div><div class="td">`+t2('tipDisclaimer')+`</div>`;
}

/* ---- countdown panel (nearest event + nearest holiday, live ticking if time given) ---- */
let countdownTickerId=null;
function nearestUpcoming(){
  const nowMs = Date.now();
  const todayJDN=gregorianToJDN(TODAY.gy,TODAY.gm,TODAY.gd);
  let bestEvent=null;
  state.events.forEach(ev=>{
    const occJDN=findNextEventOccurrence(ev, todayJDN);
    if(!occJDN) return;
    const g=jdnToGregorian(occJDN);
    let targetMs;
    if(ev.time){
      const [hh,mm]=ev.time.split(':').map(Number);
      targetMs=new Date(g.gy, g.gm-1, g.gd, hh, mm, 0).getTime();
    } else {
      targetMs=new Date(g.gy, g.gm-1, g.gd, 23,59,59).getTime();
    }
    if(targetMs>=nowMs-1000){
      if(!bestEvent || targetMs<bestEvent.targetMs) bestEvent={targetMs, title:ev.title};
    }
  });
  let bestHoliday=null;
  for(let i=0;i<200;i++){
    const g=jdnToGregorian(todayJDN+i);
    const hs=cellHolidays(g.gy,g.gm,g.gd);
    if(hs.length){
      const targetMs=new Date(g.gy,g.gm-1,g.gd,23,59,59).getTime();
      if(targetMs>=nowMs-1000){ bestHoliday={targetMs, title:holidayName(hs[0])}; break; }
    }
  }
  return {bestEvent, bestHoliday};
}
function formatCountdown(ms){
  const t=T();
  if(ms<0) ms=0;
  const totalSec=Math.floor(ms/1000);
  const days=Math.floor(totalSec/86400);
  const hours=Math.floor((totalSec%86400)/3600);
  const mins=Math.floor((totalSec%3600)/60);
  const secs=totalSec%60;
  if(days>0) return days+t2('d')+" "+hours+t2('h');
  return hours+t2('h')+" "+mins+t2('mi')+" "+secs+t2('se');
}
function renderCountdownPanel(){
  const t=T();
  const {bestEvent, bestHoliday} = nearestUpcoming();
  const panel=document.getElementById("countdownPanel");
  if(!bestEvent && !bestHoliday){ panel.innerHTML=`<div class="cp-title">`+t2('countdownTitle')+`</div><div class="empty-note">`+t2('noUpcoming')+`</div>`; return; }
  let html=`<div class="cp-title">`+t2('countdownTitle')+`</div>`;
  if(bestEvent) html+=`<div class="countdown-row"><span>⏳ `+t2('nextEvent')+`: `+bestEvent.title+`</span><span class="countdown-time" data-target="`+bestEvent.targetMs+`">`+formatCountdown(bestEvent.targetMs-Date.now())+`</span></div>`;

function moonPhase(gy,gm,gd){
  const jdn = gregorianToJDN(gy,gm,gd);
  const synodic = 29.530588853;
  const refNew = 2451550.1; // known new moon JDN reference
  let days = (jdn - refNew) % synodic;
  if(days<0) days += synodic;
  const frac = days/synodic;
  const illumination = (1 - Math.cos(2*Math.PI*frac))/2;
  let phaseKey;
  if(frac<0.03 || frac>0.97) phaseKey='phaseNew';
  else if(frac<0.22) phaseKey='phaseWaxCr';
  else if(frac<0.28) phaseKey='phaseFirstQ';
  else if(frac<0.47) phaseKey='phaseWaxGib';
  else if(frac<0.53) phaseKey='phaseFull';
  else if(frac<0.72) phaseKey='phaseWanGib';
  else if(frac<0.78) phaseKey='phaseLastQ';
  else phaseKey='phaseWanCr';
  return {illumination, phaseKey, ageDays:days, waxing: frac<0.5};
}
function renderMoonTool(){
  const t=T();
  const sel = state.selected || {gy:TODAY.gy,gm:TODAY.gm,gd:TODAY.gd};
  const mp = moonPhase(sel.gy,sel.gm,sel.gd);
  const pct = Math.round(mp.illumination*100);
  const litEl=document.getElementById("moonLit");
  if(litEl){
    litEl.style.width = pct+"%";
    litEl.style.left = mp.waxing? "auto":"0";
    litEl.style.right = mp.waxing? "0":"auto";
  }
  const statsEl=document.getElementById("moonStats");
  if(statsEl){
    statsEl.innerHTML = `<div>`+t2(mp.phaseKey)+`</div>
      <div>`+t2('moonIllum')+`: <b>`+pct+`%</b></div>
      <div>`+t2('moonAge')+`: <b>`+mp.ageDays.toFixed(1)+`</b></div>`;
  }
}

}

(function(){
  let touchStartX=null, touchStartY=null;
  const gridWrap=document.querySelector(".grid-wrap");
  gridWrap.addEventListener("touchstart",(e)=>{
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
  },{passive:true});
  gridWrap.addEventListener("touchend",(e)=>{
    if(touchStartX===null) return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){
      const t=T();
      goMonth(t.rtl ? (dx>0? 1:-1) : (dx>0? -1:1));
    }
    touchStartX=null; touchStartY=null;
  },{passive:true});
})();

    try{
      const imported = JSON.parse(reader.result);
